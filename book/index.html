<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The keepsake book · Nanafy</title>
<meta name="description" content="Every memory, gathered into a book.">
<meta name="theme-color" content="#0FB0A4">
<meta name="robots" content="noindex">
<style>
  :root {
    --ground: #FBF4EE; --surface: #FFFBF6; --surface-2: #F5E8DE;
    --ink: #2C1D28; --ink-soft: #6A5460; --line: #E7D7CC;
    --plum: #8A3F5C; --turq: #0a786f; --turq-deep: #085d56; --turq-ink: #04302C; --turq-soft: #A9E3DE;
    --shadow: rgba(58, 30, 44, 0.13);
    --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: var(--sans); -webkit-font-smoothing: antialiased;
  }

  /* ---------- Screen-only toolbar ---------- */
  .bar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,251,246,.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 12px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .bar .mark { font-family: var(--serif); font-size: 1.05rem; letter-spacing: -.01em; }
  .bar .mark b { color: var(--turq); }
  .bar .spacer { flex: 1 1 auto; }
  .bar .meta { font-size: .82rem; color: var(--ink-soft); }
  .bar a.back {
    font-size: .84rem; font-weight: 700; color: var(--turq-deep);
    text-decoration: none; padding: 7px 13px; border: 1px solid var(--turq-soft); border-radius: 8px;
  }
  .bar a.back:hover { background: var(--turq); color: #fff; border-color: var(--turq); }
  .bar button {
    border: 0; border-radius: 8px; background: var(--turq); color: #fff;
    font: inherit; font-weight: 800; font-size: .92rem; padding: 11px 20px; cursor: pointer;
    box-shadow: 0 10px 22px -12px rgba(10,120,111,.7);
  }
  .bar button[disabled] { opacity: .5; cursor: default; box-shadow: none; }
  /* Peecho order button, dressed as ours */
  #orderWrap a, #orderWrap a:visited {
    display: inline-block; border-radius: 8px; background: var(--turq); color: #fff !important;
    font-weight: 800; font-size: .92rem; padding: 11px 20px; text-decoration: none;
    box-shadow: 0 10px 22px -12px rgba(10,120,111,.7); cursor: pointer;
  }
  #orderWrap a:hover { background: var(--turq-deep); }

  .hint {
    max-width: 760px; margin: 18px auto 0; padding: 0 22px;
    font-size: .86rem; color: var(--ink-soft); text-align: center;
  }

  /* ---------- The book ---------- */
  .book { max-width: 760px; margin: 26px auto 60px; padding: 0 22px; }
  .sheet {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 26px 60px -40px var(--shadow); padding: 54px 52px 46px; margin-bottom: 26px;
  }

  /* Cover */
  .cover { text-align: center; padding: 74px 52px 66px; }
  .cover .kicker {
    font-size: .68rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase;
    color: var(--turq-deep);
  }
  .cover .rule { width: 44px; height: 2px; background: var(--turq); margin: 20px auto 26px; border-radius: 2px; }
  .cover h1 {
    font-family: var(--serif); font-weight: 400; font-size: 2.9rem; line-height: 1.12;
    margin: 0 0 6px; letter-spacing: -.02em;
  }
  .cover .sub { font-family: var(--serif); font-style: italic; color: var(--plum); font-size: 1.12rem; margin: 10px 0 0; }
  .cover .portrait {
    width: 190px; height: 190px; border-radius: 50%; object-fit: cover;
    margin: 30px auto 4px; display: block; border: 5px solid var(--surface-2);
  }
  .cover .foot { margin-top: 34px; font-size: .88rem; color: var(--ink-soft); line-height: 1.7; }

  /* Questions page */
  .qs h2, .closing h2 {
    font-family: var(--serif); font-weight: 400; font-size: 1.55rem; margin: 0 0 4px; letter-spacing: -.01em;
  }
  .qs .lead, .closing .lead { color: var(--ink-soft); font-size: .92rem; margin: 0 0 26px; }
  .qs ol { margin: 0; padding: 0; list-style: none; counter-reset: q; }
  .qs li {
    counter-increment: q; position: relative; padding: 0 0 18px 42px;
    font-family: var(--serif); font-size: 1.06rem; line-height: 1.55;
  }
  .qs li::before {
    content: counter(q); position: absolute; left: 0; top: 1px;
    width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); color: var(--turq-deep);
    font-family: var(--sans); font-weight: 800; font-size: .78rem;
    display: flex; align-items: center; justify-content: center;
  }

  /* Memories */
  .memories { }
  .memories .section-head {
    text-align: center; padding: 6px 0 30px; border-bottom: 1px solid var(--line); margin-bottom: 34px;
  }
  .memories .section-head h2 {
    font-family: var(--serif); font-weight: 400; font-size: 1.55rem; margin: 0;
  }
  .memories .section-head p { margin: 6px 0 0; font-size: .88rem; color: var(--ink-soft); }

  .mem { break-inside: avoid; page-break-inside: avoid; padding: 0 0 40px; }
  .mem + .mem { border-top: 1px solid var(--line); padding-top: 34px; }
  .mem .q {
    font-size: .7rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase;
    color: var(--turq-deep); margin: 0 0 12px;
  }
  .mem .body {
    font-family: var(--serif); font-size: 1.1rem; line-height: 1.72; margin: 0;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .mem .body::first-letter { }
  .mem .who {
    margin: 18px 0 0; font-family: var(--serif); font-style: italic; color: var(--plum); font-size: 1rem;
  }
  .mem .who .when { font-style: normal; color: var(--ink-soft); font-size: .84rem; font-family: var(--sans); }
  .mem figure { margin: 20px 0 0; }
  .mem figure img {
    width: 100%; max-height: 460px; object-fit: cover; border-radius: 10px; display: block;
    border: 1px solid var(--line);
  }

  /* Photo collage blocks (photo-lane batches, up to four per page) */
  .collage { display: grid; gap: 8px; margin: 6px 0 0; }
  .collage img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); display: block; }
  .collage.n1 { grid-template-columns: 1fr; }
  .collage.n1 img { max-height: 560px; }
  .collage.n2 { grid-template-columns: 1fr 1fr; }
  .collage.n2 img { aspect-ratio: 3/4; }
  .collage.n3 { grid-template-columns: 1fr 1fr; }
  .collage.n3 img:first-child { grid-column: 1 / -1; aspect-ratio: 16/9; }
  .collage.n3 img { aspect-ratio: 4/3; }
  .collage.n4 { grid-template-columns: 1fr 1fr; }
  .collage.n4 img { aspect-ratio: 1; }

  /* Arrange mode: owner-only controls to reorder the book's blocks */
  .arr-tools { display: none; }
  body.arranging .arr-tools { display: flex; gap: 6px; justify-content: flex-end; margin: 0 0 8px; }
  .arr-btn { border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink);
    font: inherit; font-size: 15px; font-weight: 800; width: 40px; height: 34px; cursor: pointer; }
  .arr-btn:hover { border-color: var(--turq); color: var(--turq-deep); }
  body.arranging .mem.block { outline: 1.5px dashed var(--turq-soft); outline-offset: 10px; border-radius: 4px; }
  .arr-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .arr-bar button { border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink);
    font: inherit; font-size: .85rem; font-weight: 800; padding: 8px 12px; cursor: pointer; }
  .arr-bar #arrSave { background: var(--turq); border-color: var(--turq); color: #fff; }
  .arr-msg { font-size: .8rem; color: var(--ink-soft); }

  /* Closing */
  .closing { text-align: center; }
  .closing .flower { width: 46px; height: 46px; margin: 0 auto 20px; display: block; }
  .closing .count { font-family: var(--serif); font-size: 2rem; color: var(--turq-deep); margin: 0; }
  .closing .fine { margin: 26px 0 0; font-size: .8rem; color: var(--ink-soft); }

  .state { max-width: 520px; margin: 70px auto; padding: 0 22px; text-align: center; }
  .state h1 { font-family: var(--serif); font-weight: 400; font-size: 1.6rem; margin: 0 0 10px; }
  .state p { color: var(--ink-soft); font-size: .95rem; line-height: 1.6; }
  .state input {
    width: 100%; text-align: center; letter-spacing: 6px; font-weight: 700; text-transform: uppercase;
    font-family: var(--serif); font-size: 16px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); color: var(--ink); padding: 13px 15px; outline: none; margin-top: 18px;
  }
  .state input:focus { border-color: var(--turq); box-shadow: 0 0 0 3px var(--turq-soft); }
  .state button {
    width: 100%; margin-top: 12px; border: 0; border-radius: 10px; background: var(--turq); color: #fff;
    font: inherit; font-size: 1rem; font-weight: 800; padding: 14px; cursor: pointer;
  }

  @media (max-width: 640px) {
    .sheet { padding: 34px 24px 30px; border-radius: 12px; }
    .cover { padding: 48px 24px 42px; }
    .cover h1 { font-size: 2.15rem; }
    .cover .portrait { width: 150px; height: 150px; }
  }

  /* ---------- Print guard ----------
     The on-screen book is a preview. The real book is the printed
     keepsake (coming via print-on-demand) — so browser print/PDF
     export shows a note instead of the pages. */
  .print-guard { display: none; }
  @media print {
    .bar, .hint, .state, .book { display: none !important; }
    .print-guard {
      display: block; padding: 40mm 20mm 0; text-align: center;
      font-family: var(--serif); color: #23181f;
    }
    .print-guard h1 { font-weight: 400; font-size: 22pt; margin: 0 0 8pt; }
    .print-guard p { font-family: var(--sans); font-size: 11pt; color: #5d4f57; }
  }
</style>
</head>
<body>

<div class="bar" id="bar" hidden>
  <span class="mark"><b>Nana</b>fy</span>
  <a class="back" id="backLink" href="/keepsake/">Back to keepsake</a>
  <span class="spacer"></span>
  <span class="meta" id="barMeta"></span>
  <span id="orderWrap"></span>
</div>

<p class="hint" id="hint" hidden>
  A preview of the keepsake book. Order it as a printed, bound book with the button above.
</p>

<div class="print-guard">
  <h1>This book lives at nanafy.ai</h1>
  <p>The keepsake book will be available as a beautifully printed, bound book — coming soon.</p>
</div>

<div id="root"></div>

<script src="/js/session.js"></script>
<script>
(function () {
  'use strict';

  // Peecho async print button: the buyer pays in Peecho's checkout, Peecho
  // pings our webhook, and the print-orders worker generates + delivers the
  // book PDF afterwards (see nanify repo, tools/book-pdf/).
  var PEECHO_BUTTON_KEY = '178526714163067446';

  var SUPABASE_URL = Nanafy.SUPABASE_URL;
  var ANON_KEY = Nanafy.ANON_KEY;
  var HEADERS = { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY };

  var root = document.getElementById('root');
  var bar = document.getElementById('bar');
  var hint = document.getElementById('hint');
  var barMeta = document.getElementById('barMeta');
  var backLink = document.getElementById('backLink');

  var TYPE_WORD = {
    memorial: 'In loving memory of',
    wedding: 'In celebration of',
    birthday: 'In celebration of',
    graduation: 'In celebration of',
    tribute: 'In tribute to',
    other: 'For'
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function niceDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  }

  function getCode() {
    var m = /[?&]c=([^&]+)/.exec(location.search);
    return m ? decodeURIComponent(m[1]).toUpperCase().trim() : '';
  }

  function showState(title, msg, withForm) {
    root.innerHTML =
      '<div class="state">' +
        '<h1>' + esc(title) + '</h1>' +
        '<p>' + msg + '</p>' +
        (withForm
          ? '<form id="codeForm">' +
              '<input id="codeInput" maxlength="6" placeholder="ABC123" aria-label="Keepsake code">' +
              '<button type="submit">Open the book</button>' +
            '</form>'
          : '') +
      '</div>';
    var f = document.getElementById('codeForm');
    if (f) {
      f.addEventListener('submit', function (e) {
        e.preventDefault();
        var v = document.getElementById('codeInput').value.trim().toUpperCase();
        if (v) location.search = '?c=' + encodeURIComponent(v);
      });
    }
  }

  function coverSheet(ev, count) {
    var word = TYPE_WORD[ev.event_type] || TYPE_WORD.other;
    var name = ev.honoree || ev.title || 'A life worth remembering';
    return '' +
      '<section class="sheet cover">' +
        '<div class="kicker">A Nanafy Keepsake</div>' +
        '<div class="rule"></div>' +
        '<p class="sub" style="margin:0 0 14px">' + esc(word) + '</p>' +
        '<h1>' + esc(name) + '</h1>' +
        (ev.title && ev.honoree && ev.title !== ev.honoree
          ? '<p class="sub">' + esc(ev.title) + '</p>' : '') +
        (ev.photo_url
          ? '<img class="portrait" src="' + esc(ev.photo_url) + '" alt="">' : '') +
        '<div class="foot">' +
          esc(count) + ' ' + (count === 1 ? 'memory' : 'memories') + ' gathered' +
          (ev.event_date ? '<br>' + esc(niceDate(ev.event_date)) : '') +
        '</div>' +
      '</section>';
  }

  function questionsSheet(prompts) {
    if (!prompts.length) return '';
    var items = prompts.map(function (p) {
      return '<li>' + esc(p.text) + '</li>';
    }).join('');
    return '' +
      '<section class="sheet qs">' +
        '<h2>The questions we asked</h2>' +
        '<p class="lead">Everyone who came was invited to answer in their own words.</p>' +
        '<ol>' + items + '</ol>' +
      '</section>';
  }

  // A memory is a "photo-only" when it carries a picture and no words — the
  // photo lane produces these. Consecutive photo-only memories gather into
  // collage blocks of up to four, so a batch of forty becomes ten clean
  // pages instead of forty sparse ones.
  function isPhotoOnly(m) { return m.photo_url && !(m.body || '').trim() && !m.prompt_text; }

  // The ordered list of memories becomes the ordered list of BLOCKS the book
  // renders and the host arranges: one block per written memory, one block
  // per group of up to four consecutive photo-only memories.
  function toBlocks(mems) {
    var blocks = [];
    var run = [];
    function flushRun() {
      while (run.length) { blocks.push({ kind: 'photos', mems: run.splice(0, 4) }); }
    }
    mems.forEach(function (m) {
      if (isPhotoOnly(m)) { run.push(m); }
      else { flushRun(); blocks.push({ kind: 'words', mems: [m] }); }
    });
    flushRun();
    return blocks;
  }

  function blockHtml(b, i) {
    var head = '<article class="mem block" data-bi="' + i + '">';
    var tools =
      '<div class="arr-tools">' +
        '<button type="button" class="arr-btn" data-move="-1" aria-label="Move earlier">↑</button>' +
        '<button type="button" class="arr-btn" data-move="1" aria-label="Move later">↓</button>' +
      '</div>';
    if (b.kind === 'words') {
      var m = b.mems[0];
      return head + tools +
        (m.prompt_text ? '<p class="q">' + esc(m.prompt_text) + '</p>' : '') +
        ((m.body || '').trim() ? '<p class="body">' + esc(m.body) + '</p>' : '') +
        '<p class="who">' +
          (m.contributor_name ? '— ' + esc(m.contributor_name) : '— A friend') +
          (m.created_at ? ' <span class="when">' + esc(niceDate(m.created_at)) + '</span>' : '') +
        '</p>' +
        (m.photo_url ? '<figure><img src="' + esc(m.photo_url) + '" alt=""></figure>' : '') +
      '</article>';
    }
    var names = [];
    b.mems.forEach(function (m2) {
      var n = (m2.contributor_name || '').trim();
      if (n && names.indexOf(n) === -1) names.push(n);
    });
    return head + tools +
      '<div class="collage n' + b.mems.length + '">' +
        b.mems.map(function (m2) { return '<img src="' + esc(m2.photo_url) + '" alt="">'; }).join('') +
      '</div>' +
      '<p class="who">' + (names.length ? '— Photos from ' + esc(names.join(' & ')) : '— Photos from the gathering') + '</p>' +
    '</article>';
  }

  function memoriesSheet(blocks, arranged) {
    return '' +
      '<section class="sheet memories">' +
        '<div class="section-head">' +
          '<h2>The memories</h2>' +
          '<p>' + (arranged ? 'Arranged by the host.' : 'In the order they were shared.') + '</p>' +
        '</div>' +
        blocks.map(blockHtml).join('') +
      '</section>';
  }

  function closingSheet(ev, mems) {
    var names = [];
    mems.forEach(function (m) {
      var n = (m.contributor_name || '').trim();
      if (n && names.indexOf(n) === -1) names.push(n);
    });
    var name = ev.honoree || ev.title || 'them';
    return '' +
      '<section class="sheet closing">' +
        '<p class="count">' + mems.length + '</p>' +
        '<h2>' + (mems.length === 1 ? 'memory' : 'memories') + ' of ' + esc(name) + '</h2>' +
        '<p class="lead">' +
          (names.length
            ? 'Gathered by ' + esc(names.join(' · '))
            : 'Gathered by everyone who was there') +
        '</p>' +
        '<p class="fine">Kept forever at nanafy.ai</p>' +
      '</section>';
  }

  async function load() {
    var code = getCode();
    if (!code) {
      showState('Which keepsake?', 'Enter the 6-character code from your keepsake link.', true);
      return;
    }

    showState('Gathering the book…', 'One moment.', false);

    var ev;
    try {
      // Membership-scoped read: the join RPC is the way in with a share code.
      ev = await Nanafy.join(code,
        'id,title,honoree,event_type,event_date,description,photo_url,owner_id,' +
        'prompts(text,position),memories(id,status,position,contributor_name,prompt_text,body,photo_url,created_at)');
      // Owners can read every status; the book prints only approved memories.
      if (ev && Array.isArray(ev.memories)) {
        ev.memories = ev.memories.filter(function (m) { return m.status === 'approved'; });
      }
    } catch (err) {
      showState('Could not load the book',
        'Something went wrong reaching the keepsake. Check your connection and try again.', false);
      return;
    }

    if (!ev) {
      showState('No keepsake with that code',
        'Double-check the 6 characters — they are case-insensitive.', true);
      return;
    }
    var prompts = (ev.prompts || []).slice().sort(function (a, b) {
      return (a.position || 0) - (b.position || 0);
    });
    // The host's arrangement wins; unplaced memories follow, oldest first.
    var mems = (ev.memories || []).slice().sort(function (a, b) {
      var pa = a.position == null ? Infinity : a.position;
      var pb = b.position == null ? Infinity : b.position;
      if (pa !== pb) return pa - pb;
      return new Date(a.created_at || 0) - new Date(b.created_at || 0);
    });
    var arranged = mems.some(function (m) { return m.position != null; });

    document.title = (ev.honoree || ev.title || 'Keepsake') + ' · The book · Nanafy';
    backLink.href = '/keepsake/?c=' + encodeURIComponent(code);

    if (!mems.length) {
      showState('The book is still empty',
        'No memories have been added yet. Share the keepsake link with your guests, then come back — ' +
        'the book fills itself in.', false);
      bar.hidden = false;
      return;
    }

    var blocks = toBlocks(mems);
    root.innerHTML =
      '<div class="book">' +
        coverSheet(ev, mems.length) +
        questionsSheet(prompts) +
        memoriesSheet(blocks, arranged) +
        closingSheet(ev, mems) +
      '</div>';

    bar.hidden = false;
    hint.hidden = false;
    barMeta.textContent = mems.length + (mems.length === 1 ? ' memory' : ' memories');
    hint.innerHTML = 'You’re previewing the real book — the printed copy contains every page below, ' +
      'as a ' + bookPageCount(prompts.length, blocks.length) + '-page softcover (A4).';

    mountOrderButton(ev, prompts, blocks);
    mountArrange(ev, prompts, mems);
  }

  // MUST mirror the sheet math in nanify/tools/book-pdf/generate-book-pdf.mjs:
  // cover + questions page (if any prompts) + one page per BLOCK (a written
  // memory, or a collage of up to four photo-only memories) + closing,
  // padded to min 24 pages / even count (24 qualifies for both softcover
  // and hardcover), + back cover.
  function bookPageCount(promptCount, blockCount) {
    var sheets = 1 + (promptCount ? 1 : 0) + blockCount + 1;
    while (sheets + 1 < 24 || (sheets + 1) % 2 !== 0) sheets++;
    return sheets + 1;
  }

  // ---- Arrange mode: the host moves blocks until the book reads right ----
  // The saved order is memory-level `position` values, which is also exactly
  // what the print generator applies — what the host sees here is what the
  // printed book does.
  function mountArrange(ev, prompts, mems) {
    var s = null;
    try {
      var raw = localStorage.getItem('sb-vigenqlwwoknxjzahvtv-auth-token');
      if (raw) { var j = JSON.parse(raw); var sess = j.currentSession || j;
        if (sess.access_token && sess.user) s = { token: sess.access_token, userId: sess.user.id }; }
    } catch (e) {}
    if (!s || !ev.owner_id || ev.owner_id !== s.userId) return; // owner only

    var wrap = document.createElement('div');
    wrap.className = 'arr-bar';
    wrap.innerHTML =
      '<button type="button" id="arrToggle">Arrange the book</button>' +
      '<button type="button" id="arrNana" hidden>✨ Let Nana arrange it</button>' +
      '<button type="button" id="arrSave" hidden>Save arrangement</button>' +
      '<span id="arrMsg" class="arr-msg"></span>';
    bar.appendChild(wrap);

    var order = mems.slice(); // working copy, memory-level
    var dirty = false;

    function rerender() {
      var blocks = toBlocks(order);
      document.querySelector('.sheet.memories').outerHTML = memoriesSheet(blocks, true);
      document.body.classList.add('arranging');
      wireMoves(blocks);
      document.getElementById('arrSave').hidden = !dirty;
    }

    function wireMoves(blocks) {
      Array.prototype.forEach.call(document.querySelectorAll('.arr-btn'), function (btn) {
        btn.addEventListener('click', function () {
          var bi = +btn.closest('.block').dataset.bi;
          var dir = +btn.dataset.move;
          var ti = bi + dir;
          if (ti < 0 || ti >= blocks.length) return;
          // Swap the two blocks, then flatten back to a memory list.
          var next = blocks.slice();
          var tmp = next[bi]; next[bi] = next[ti]; next[ti] = tmp;
          order = [];
          next.forEach(function (b) { b.mems.forEach(function (m) { order.push(m); }); });
          dirty = true;
          rerender();
        });
      });
    }

    document.getElementById('arrToggle').addEventListener('click', function () {
      var on = document.body.classList.toggle('arranging');
      this.textContent = on ? 'Done arranging' : 'Arrange the book';
      document.getElementById('arrNana').hidden = !on;
      document.getElementById('arrSave').hidden = !on || !dirty;
      if (on) rerender();
    });

    document.getElementById('arrSave').addEventListener('click', async function () {
      var btn = this;
      btn.disabled = true; btn.textContent = 'Saving…';
      var msg = document.getElementById('arrMsg');
      try {
        var h = { apikey: ANON_KEY, Authorization: 'Bearer ' + s.token, 'Content-Type': 'application/json', Prefer: 'return=minimal' };
        for (var i = 0; i < order.length; i++) {
          if (order[i].position === i) continue; // unchanged rows skip the write
          var r = await fetch(SUPABASE_URL + '/rest/v1/memories?id=eq.' + encodeURIComponent(order[i].id), {
            method: 'PATCH', headers: h, body: JSON.stringify({ position: i })
          });
          if (!r.ok) throw new Error('save');
          order[i].position = i;
        }
        dirty = false;
        btn.textContent = 'Saved ✓';
        setTimeout(function () { btn.textContent = 'Save arrangement'; btn.hidden = true; btn.disabled = false; }, 1500);
        msg.textContent = 'This order is what the printed book uses.';
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Save arrangement';
        msg.textContent = 'Couldn’t save — check your connection and try again.';
      }
    });

    // Nana proposes an arrangement; the host still reviews and saves it.
    document.getElementById('arrNana').addEventListener('click', async function () {
      var btn = this;
      btn.disabled = true; btn.textContent = 'Nana is thinking…';
      var msg = document.getElementById('arrMsg');
      try {
        var res = await fetch(SUPABASE_URL + '/functions/v1/nana-curate', {
          method: 'POST',
          headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + s.token, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            eventType: ev.event_type,
            honoree: ev.honoree || ev.title,
            memories: order.map(function (m) {
              return { id: m.id, who: m.contributor_name || null, hasPhoto: !!m.photo_url,
                words: (m.body || '').slice(0, 240), question: m.prompt_text || null, at: m.created_at };
            })
          })
        });
        var data = await res.json().catch(function () { return {}; });
        if (!res.ok || !Array.isArray(data.order)) throw new Error('nana');
        var byId = {};
        order.forEach(function (m) { byId[m.id] = m; });
        var proposed = data.order.map(function (id) { return byId[id]; }).filter(Boolean);
        order.forEach(function (m) { if (proposed.indexOf(m) === -1) proposed.push(m); }); // never lose one
        order = proposed;
        dirty = true;
        rerender();
        msg.textContent = data.note ? 'Nana: ' + data.note + ' — review it, then save.' : 'Review Nana’s arrangement, then save.';
      } catch (e) {
        msg.textContent = 'Nana couldn’t arrange it right now — you can still move things yourself.';
      }
      btn.disabled = false; btn.textContent = '✨ Let Nana arrange it';
    });
  }

  function mountOrderButton(ev, prompts, blocks) {
    var ref = getCode() + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    var a = document.createElement('a');
    a.className = 'peecho-print-button';
    a.title = 'Order the printed keepsake book';
    a.href = 'https://www.peecho.com/';
    a.setAttribute('data-filetype', 'pdf');
    a.setAttribute('data-width', '210');
    a.setAttribute('data-height', '297');
    a.setAttribute('data-pages', String(bookPageCount(prompts.length, blocks.length)));
    a.setAttribute('data-noprice', 'true');
    a.setAttribute('data-currency', 'USD');
    a.setAttribute('data-reference', ref);
    // Fills the preview box in Peecho's checkout: the honoree's photo, or
    // the Nanafy mark. Hosted on Supabase storage — nanafy.ai itself is
    // behind the Cloudflare gate, which Peecho's servers can't pass.
    a.setAttribute('data-thumbnail', ev.photo_url ||
      SUPABASE_URL + '/storage/v1/object/public/books/brand/nanafy-icon.png');
    a.textContent = 'Order the printed book';
    document.getElementById('orderWrap').appendChild(a);

    var p = document.createElement('script');
    p.async = true;
    // The script's own DOM scan runs at page load, which has already passed
    // by the time we inject it — attach() explicitly once it arrives.
    p.onload = function () {
      if (window.peecho && window.peecho.attach) window.peecho.attach();
    };
    p.src = 'https://d3aln0nj58oevo.cloudfront.net/button/script/' + PEECHO_BUTTON_KEY + '.js';
    document.head.appendChild(p);
  }

  load();
})();
</script>
