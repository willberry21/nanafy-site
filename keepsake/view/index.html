<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The keepsake · Nanafy</title>
<meta name="description" content="Every memory, gathered in one place.">
<meta name="theme-color" content="#115E67">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Lato:wght@400;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Lato:wght@400;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  /* The guest's keepsake — read-only, warm, zero chrome. No edit pills, no
     review queues, no share keys: those live on the host page. */
  :root {
    --ground:#115E67; --surface:#14676F; --surface-2:#0E5259;
    --ink:#FFFFFF; --ink-soft:rgba(255,255,255,.72); --ink-faint:rgba(255,255,255,.45);
    --line:rgba(255,255,255,.18);
    --turq:#5FE0D2; --turq-ink:#04302C; --pink:#EFA8BE; --verm:#FF7A63;
    --display:"Josefin Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --serif:"Lora",Georgia,serif;
    --sans:"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { background:var(--ground); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }

  .bar {
    position:sticky; top:0; z-index:20;
    background:rgba(17,94,103,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:12px 18px; display:flex; align-items:center; gap:12px;
  }
  .bar .brand { display:flex; align-items:center; gap:9px; text-decoration:none; }
  .bar .mark { font-family:var(--display); font-weight:600; letter-spacing:.18em; text-transform:uppercase; font-size:1.02rem; color:var(--pink); }
  .bar .mark b { color:#fff; font-weight:600; }
  .bar .spacer { flex:1 1 auto; }
  .bar a.addcta {
    font-size:.85rem; font-weight:700; color:var(--turq-ink); background:var(--turq);
    text-decoration:none; padding:9px 16px; border-radius:999px;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .bar a.addcta:active { transform:scale(.95); }

  .wrap { max-width:640px; margin:0 auto; padding:36px 20px 70px; }
  .hero { text-align:center; margin-bottom:30px; }
  .hero .portrait {
    width:110px; height:110px; border-radius:28px; object-fit:cover;
    margin:0 auto 20px; display:block; border:1px solid var(--line);
  }
  .hero .prep { font-family:var(--display); font-weight:600; font-size:.74rem; letter-spacing:.24em; color:var(--turq); text-transform:uppercase; margin:0 0 12px; }
  .hero h1 { font-family:var(--display); font-weight:300; font-size:clamp(2rem,7vw,2.9rem); letter-spacing:.01em; line-height:1.12; margin:0; text-wrap:balance; }
  .hero .sub { margin:14px 0 0; color:var(--ink-soft); font-family:var(--serif); font-style:italic; font-size:1rem; }

  /* The three ways to experience it — slideshow leads. */
  .experiences { display:flex; flex-direction:column; gap:10px; margin:0 0 40px; }
  .exp {
    display:flex; align-items:center; gap:16px; text-decoration:none; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), border-color .15s ease;
  }
  .exp:active { transform:scale(.98); }
  .exp:hover { border-color:var(--turq); }
  .exp.lead { background:var(--turq); border-color:var(--turq); color:var(--turq-ink); }
  .exp .glyph { font-size:1.5rem; line-height:1; width:40px; text-align:center; flex:none; }
  .exp .x-title { font-family:var(--display); font-weight:600; font-size:1.02rem; letter-spacing:.02em; }
  .exp .x-line { font-size:.84rem; opacity:.75; margin-top:2px; }
  .exp .arrow { margin-left:auto; font-size:1.2rem; opacity:.6; }

  .wall-label {
    font-family:var(--display); font-weight:600; font-size:.74rem; letter-spacing:.22em;
    text-transform:uppercase; color:var(--turq); margin:0 0 16px; text-align:center;
  }
  .mem {
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:20px; margin-bottom:14px; overflow:hidden;
  }
  .mem .q { font-family:var(--display); font-weight:600; font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:var(--turq); margin:0 0 10px; }
  .mem .body { font-family:var(--serif); font-size:1.04rem; line-height:1.65; margin:0; white-space:pre-wrap; }
  .mem .who { margin:14px 0 0; font-family:var(--display); font-weight:600; font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--pink); }
  .mem img { width:calc(100% + 40px); margin:14px -20px -20px; display:block; }
  .mem.photo-only { padding:0; }
  .mem.photo-only img { width:100%; margin:0; }
  .mem.photo-only .meta { padding:14px 20px; }
  .mem.photo-only .meta .body { font-size:.95rem; font-style:italic; }
  .photo-pair { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  .photo-pair .mem { margin:0; }
  .photo-pair img { aspect-ratio:1; object-fit:cover; }


  /* --- when & where ---------------------------------------------------------
     A guest who scans the code on the order of service usually wants the thing
     the paper card already told them: when it starts and where it is. Only
     rendered when the host filled something in. */
  .when-card {
    border:1px solid var(--line); border-radius:14px; background:var(--surface-2, rgba(255,255,255,.05));
    padding:16px 18px; margin:0 0 22px; text-align:center;
  }
  .when-card .wc-kicker {
    font-family:var(--display, inherit); font-size:.68rem; font-weight:600; letter-spacing:.2em;
    text-transform:uppercase; color:var(--turq); margin:0 0 10px;
  }
  .when-card .wc-row {
    display:flex; align-items:center; justify-content:center; gap:9px;
    font-family:var(--serif, inherit); font-size:1.02rem; line-height:1.4; margin:0;
  }
  .when-card .wc-row + .wc-row { margin-top:7px; }
  .when-card .wc-row svg { flex:none; color:var(--turq); }

  /* voice memories — the recording reads as part of the card, not a widget */
  .voice { margin:14px 0 0; border:1px solid var(--line); border-radius:12px; background:var(--surface-2, rgba(255,255,255,.05)); padding:11px 13px; }
  .voice-tag { display:flex; align-items:center; gap:7px; font-family:var(--display); font-weight:600; font-size:.68rem;
    letter-spacing:.16em; text-transform:uppercase; color:var(--turq); margin:0 0 8px; }
  .voice-tag svg { flex:none; }
  .voice audio { width:100%; height:40px; display:block; color-scheme:dark; }
  .mem.photo-only .meta .voice { margin-top:10px; }


  /* --- skeletons ----------------------------------------------------------
     A shape where the content will be, instead of the word "Loading". The
     wait is the same length; it stops being a blank screen followed by a pop.
     Sizes deliberately match the real thing so nothing jumps when it lands. */
  @keyframes skShimmer { 100% { transform: translateX(100%); } }
  @keyframes skFade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .sk { position:relative; overflow:hidden; border-radius:10px; background:rgba(255,255,255,.07); }
  .sk::after {
    content:""; position:absolute; inset:0; transform:translateX(-100%);
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
    animation:skShimmer 1.6s ease-in-out infinite;
  }
  .sk-line { height:15px; margin:0 0 11px; }
  .sk-line:last-child { margin-bottom:0; }
  .sk-line.tall { height:30px; margin-bottom:16px; }
  .sk-line.w90{ width:90% } .sk-line.w75{ width:75% } .sk-line.w60{ width:60% } .sk-line.w40{ width:40% } .sk-line.w25{ width:25% }
  .sk-line.mid { margin-left:auto; margin-right:auto; }
  .sk-card { border:1px solid var(--line); border-radius:14px; padding:20px; margin:0 0 14px; }
  .sk-block { border-radius:12px; }
  .sk-wrap { animation:skFade .3s ease both; }
  /* Content replacing a skeleton eases in rather than snapping. */
  .did-load { animation:skFade .34s cubic-bezier(.22,.9,.36,1) both; }
  @media (prefers-reduced-motion: reduce) {
    .sk::after { animation:none; }
    .sk-wrap, .did-load { animation:none; }
  }

  .closing { text-align:center; margin-top:44px; color:var(--ink-faint); font-size:.85rem; }
  .closing .add { color:var(--turq); text-decoration:none; font-weight:700; }
  .state { text-align:center; padding:80px 24px; color:var(--ink-soft); }

  /* --- the keepsake tab bar ------------------------------------------------
     The keepsake, the slideshow, the mosaic and the book used to be four
     separate destinations you reached through cards and "back" links. They
     are four views of one thing, so they get one bar that never moves. It is
     static HTML, so it paints with the page rather than after the fetch. */
  .tabbar {
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    display:grid; grid-template-columns:repeat(5,1fr);
    background:color-mix(in srgb, var(--surface, #0E5259) 92%, transparent);
    -webkit-backdrop-filter:saturate(140%) blur(14px); backdrop-filter:saturate(140%) blur(14px);
    border-top:1px solid var(--line, rgba(255,255,255,.22));
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar .tab {
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    min-height:58px; padding:8px 2px 7px; border:0; background:none; cursor:pointer;
    color:var(--ink-soft, rgba(255,255,255,.70)); text-decoration:none;
    font-family:var(--sans, inherit); font-size:11px; font-weight:700; letter-spacing:.02em;
    -webkit-tap-highlight-color:transparent;
    transition:color .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .tabbar .tab svg { display:block; }
  .tabbar .tab:active { transform:scale(.92); }
  .tabbar .tab[aria-current="page"] { color:var(--turq, #5FE0D2); }
  .tabbar .tab:focus-visible { outline:2px solid var(--turq, #5FE0D2); outline-offset:-3px; }
  .tabbar[hidden] { display:none; }
  .tab-toast {
    position:fixed; left:50%; transform:translateX(-50%) translateY(8px); z-index:61;
    bottom:calc(72px + env(safe-area-inset-bottom));
    background:var(--turq, #5FE0D2); color:var(--turq-ink, #073B36);
    font-family:var(--sans, inherit); font-size:.86rem; font-weight:700;
    padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .tab-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  /* room for the bar, so nothing hides behind it */
  body.has-tabbar { padding-bottom:calc(74px + env(safe-area-inset-bottom)); }
  body.has-tabbar .back { display:none; }
  @media (prefers-reduced-motion: reduce) {
    .tabbar .tab { transition:none; } .tabbar .tab:active { transform:none; }
    .tab-toast { transition:none; }
  }
  .tab-toast { max-width:min(88vw,420px); text-align:center; overflow-wrap:anywhere; }
  /* On a wide screen a full-bleed bottom bar reads like a phone UI stranded
     on a desktop — float it instead. */
  @media (min-width:720px) {
    .tabbar {
      left:50%; right:auto; transform:translateX(-50%); bottom:18px;
      width:min(560px, calc(100% - 32px));
      border:1px solid var(--line, rgba(255,255,255,.22)); border-radius:18px;
      box-shadow:0 18px 40px -22px rgba(0,0,0,.55);
    }
    body.has-tabbar { padding-bottom:104px; }
    .tab-toast { bottom:96px; }
  }


  /* --- page transitions -----------------------------------------------------
     Cross-document view transitions: moving between the keepsake, the mosaic
     and the book cross-fades instead of blinking white. The tab bar and the
     site header are named, so they stay put while the content underneath
     changes — which is the whole difference between "an app with tabs" and
     "four web pages". Browsers without support simply navigate as before. */
  @view-transition { navigation: auto; }
  .tabbar { view-transition-name: nanafy-tabbar; }
  .topnav, .topbar, .bar { view-transition-name: nanafy-header; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; }
  @media (prefers-reduced-motion: reduce) {
    ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
  }
</style>
<script src="/js/session.js?v=20260810b"></script>
<script src="/js/keep.js?v=20260814a"></script>
</head>
<body>

<div class="bar">
  <a class="brand" href="https://nanafy.ai/">
    <svg viewBox="0 0 100 100" width="24" height="24" aria-hidden="true"><g fill="#FFFFFF"><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(0 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(30 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(60 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(90 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(120 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(150 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(180 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(210 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(240 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(270 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(300 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(330 50 50)"/><circle cx="50" cy="50" r="18.5"/></g><circle cx="50" cy="50" r="15" fill="#115E67"/></svg>
    <span class="mark"><b>Nana</b>fy</span>
  </a>
  <span class="spacer"></span>
  <a class="addcta" id="keepTop" href="#" hidden style="background:none;border:1px solid var(--line);color:var(--ink)">Keep</a>
  <a class="addcta" id="addTop" href="/add/">Add your memory</a>
</div>

<div class="wrap">
  <div id="app"><div class="sk-wrap" role="status" aria-busy="true" aria-label="Opening the keepsake"><div class="hero"><div class="sk sk-line w25 mid"></div><div class="sk sk-line tall w60 mid" style="height:40px"></div><div class="sk sk-line w75 mid"></div></div><div style="display:grid;gap:10px;margin:26px 0 30px"><div class="sk sk-block" style="height:74px"></div><div class="sk sk-block" style="height:74px"></div><div class="sk sk-block" style="height:74px"></div></div><div class="sk sk-line w25 mid" style="margin-bottom:18px"></div><div class="sk-card"><div class="sk sk-line w40"></div><div class="sk sk-line w90"></div><div class="sk sk-line w75"></div><div class="sk sk-line w25"></div></div><div class="sk-card"><div class="sk sk-line w40"></div><div class="sk sk-line w90"></div><div class="sk sk-line w60"></div><div class="sk sk-line w25"></div></div></div></div>
</div>

<script>
(function () {
  'use strict';

  var PREPOSITIONS = { memorial: 'In memory of', wedding: 'Celebrating', birthday: 'Celebrating', graduation: 'Congratulating', tribute: 'A tribute to', other: 'Remembering' };
  var params = new URLSearchParams(location.search);
  var code = (params.get('c') || '').trim().toUpperCase();
  var app = document.getElementById('app');

  function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }


  // --- when & where ---------------------------------------------------------
  var CAL_GLYPH = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>';
  var PIN_GLYPH = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>';
  // A plain `date` column, formatted in the reader's own locale. Parsed as
  // local noon so a UTC-midnight date never slips to the day before.
  function niceEventDate(d) {
    if (!d) return '';
    var p = String(d).split('-');
    if (p.length !== 3) return String(d);
    var dt = new Date(+p[0], +p[1] - 1, +p[2], 12);
    if (isNaN(dt)) return String(d);
    return dt.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  }
  function whenCard(ev) {
    var when = [niceEventDate(ev.event_date), (ev.event_time || '').trim()].filter(Boolean).join(' at ');
    var place = (ev.event_location || '').trim();
    if (!when && !place) return '';
    return '<div class="when-card"><p class="wc-kicker">Where and when</p>' +
      (when ? '<p class="wc-row">' + CAL_GLYPH + '<span>' + esc(when) + '</span></p>' : '') +
      (place ? '<p class="wc-row">' + PIN_GLYPH + '<span>' + esc(place) + '</span></p>' : '') +
      '</div>';
  }

  // --- voice memories ------------------------------------------------------
  var VOICE_GLYPH = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">' +
    '<path d="M4 10v4M9 6v12M14 3v18M19 9v6"/></svg>';
  function mmss(n) { n = Math.max(0, Math.round(n || 0)); return Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0'); }
  function voiceBlock(m) {
    if (!m.audio_url) return '';
    var who = m.contributor_name || 'Anonymous';
    var len = m.audio_seconds ? ' \u00b7 ' + mmss(m.audio_seconds) : '';
    return '<div class="voice"><div class="voice-tag">' + VOICE_GLYPH +
      '<span>' + esc(who) + '\u2019s voice' + len + '</span></div>' +
      '<audio controls preload="none" src="' + esc(m.audio_url) + '"></audio></div>';
  }

  function render(ev) {
    var prep = PREPOSITIONS[ev.event_type] || 'For';
    var title = ev.honoree || ev.title;
    var mems = (ev.memories || [])
      .filter(function (m) { return m.status === 'approved'; })
      .sort(function (a, b) {
        var pa = a.position == null ? Infinity : a.position;
        var pb = b.position == null ? Infinity : b.position;
        if (pa !== pb) return pa - pb;
        return new Date(a.created_at) - new Date(b.created_at);
      });
    var n = mems.length;
    var photoCount = mems.filter(function (m) { return m.photo_url; }).length;
    if (window.NanafyTabs) NanafyTabs.setMosaic(photoCount > 0);
    var q = '?c=' + encodeURIComponent(code);

    var html =
      '<div class="hero">' +
      (ev.photo_url ? '<img class="portrait" src="' + esc(ev.photo_url) + '" alt="">' : '') +
      '<p class="prep">' + esc(prep) + '</p>' +
      '<h1>' + esc(title) + '</h1>' +
      '<p class="sub">' + n + ' ' + (n === 1 ? 'memory' : 'memories') + ', from the people who were there.</p>' +
      (params.get('sent')
        ? '<p style="margin:16px auto 0;max-width:34em;font-size:.88rem;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;">Yours are with the host — they\u2019ll appear here once approved.</p>'
        : '') +
      '</div>' +
      whenCard(ev);

    // The slideshow / mosaic / book links used to live here as three big
    // cards. The tab bar at the foot of the page now does exactly that job,
    // so these were the same three destinations offered twice — and they
    // pushed the memories, which is what a guest came for, below the fold.

    if (n === 0) {
      html += '<div class="state"><b>The first memory hasn’t arrived yet.</b><br><br>' +
        'Be the one who starts it — <a class="add" style="color:var(--turq)" href="/add/' + q + '">add yours</a>.</div>';
    } else {
      html += '<p class="wall-label">The memories</p>';

      // Consecutive photo-only memories pair up into a grid; everything else
      // is a card. Same grouping instinct as the book's collages.
      var i = 0;
      while (i < mems.length) {
        var m = mems[i];
        var isPhotoOnly = m.photo_url && !(m.body || '').trim() && !m.audio_url;
        if (isPhotoOnly && i + 1 < mems.length) {
          var m2 = mems[i + 1];
          if (m2.photo_url && !(m2.body || '').trim() && !m2.audio_url) {
            html += '<div class="photo-pair">' + photoCard(m) + photoCard(m2) + '</div>';
            i += 2;
            continue;
          }
        }
        html += isPhotoOnly ? photoCard(m) : memoryCard(m);
        i++;
      }

      html += '<p class="closing">Were you there too? <a class="add" href="/add/' + q + '">Add your memory</a> — it takes a few minutes.<br><br>Gathered with Nanafy.</p>';
    }

    app.innerHTML = html;
    app.classList.add('did-load');
    document.getElementById('addTop').href = '/add/' + q;
    wireKeep(q);
  }

  // "Keep this keepsake" — shown only to people WITHOUT an account. Signed-in
  // keepers see a quiet "My keepsakes" pill instead (their membership already
  // holds this keepsake).
  async function wireKeep(q) {
    var keepTop = document.getElementById('keepTop');
    var hasAccount = await NanafyKeep.hasAccount();

    if (hasAccount) {
      NanafyKeep.attach(code); // freshly-landed magic links attach here
      keepTop.hidden = false;
      keepTop.textContent = 'My keepsakes';
      keepTop.href = '/keepsake/mine/';
      return;
    }

    function openSheet(e) {
      e.preventDefault();
      NanafyKeep.openSheet(code, function () { location.href = '/keepsake/mine/'; });
    }

    keepTop.hidden = false;
    keepTop.textContent = 'Keep';
    keepTop.addEventListener('click', openSheet);

    var exp = document.querySelector('.experiences') || document.querySelector('.hero');
    if (exp) {
      var card = document.createElement('div');
      card.innerHTML =
        '<a class="exp" href="#" id="keepCard" style="margin:0 0 40px">' +
        '<span class="glyph">&#10047;</span><span><div class="x-title">Keep this keepsake</div>' +
        '<div class="x-line">Free account &mdash; it stays in your list forever</div></span><span class="arrow">&#8250;</span></a>';
      exp.insertAdjacentElement('afterend', card.firstChild);
      document.getElementById('keepCard').addEventListener('click', openSheet);
    }

    var closing = document.querySelector('.closing');
    if (closing) {
      var line = document.createElement('p');
      line.className = 'closing';
      line.style.marginTop = '10px';
      line.innerHTML = 'Want to find this again? <a class="add" href="#" id="keepClose">Keep it in your list</a>.';
      closing.insertAdjacentElement('afterend', line);
      document.getElementById('keepClose').addEventListener('click', openSheet);
    }
  }

  function memoryCard(m) {
    return '<div class="mem">' +
      (m.prompt_text ? '<p class="q">' + esc(m.prompt_text) + '</p>' : '') +
      ((m.body || '').trim() ? '<p class="body">' + esc(m.body.trim()) + '</p>' : '') +
      voiceBlock(m) +
      (m.contributor_name ? '<p class="who">— ' + esc(m.contributor_name) + '</p>' : '') +
      (m.photo_url ? '<img src="' + esc(m.photo_url) + '" alt="" loading="lazy">' : '') +
      '</div>';
  }

  function photoCard(m) {
    return '<div class="mem photo-only">' +
      '<img src="' + esc(m.photo_url) + '" alt="" loading="lazy">' +
      (m.contributor_name
        ? '<div class="meta"><p class="who" style="margin:0">— ' + esc(m.contributor_name) + '</p></div>'
        : '') +
      '</div>';
  }

  async function init() {
    if (!code) { app.innerHTML = '<div class="state">No keepsake code in the link.</div>'; return; }
    try {
      var ev = await Nanafy.join(code,
        'id,title,honoree,event_type,event_date,event_time,event_location,photo_url,memories(id,status,position,created_at,contributor_name,prompt_text,body,photo_url,audio_url,audio_seconds)');
      render(ev);
    } catch (e) {
      app.innerHTML = '<div class="state">Couldn’t open this keepsake.<br>Check the link and try again.</div>';
    }
  }

  init();
})();
</script>

<script>
/* The keepsake tab bar. Runs inline so the bar is wired before first paint. */
(function () {
  var bar = document.getElementById('tabbar');
  if (!bar) return;
  var code = (new URLSearchParams(location.search).get('c') || '').trim();
  if (!code) return;                     // no keepsake in the URL, no bar
  var q = '?c=' + encodeURIComponent(code);
  var path = location.pathname.replace(/\/*$/, '/');

  // "Memories" means the host's own page for the host and the public view for
  // everyone else. Whichever one you last opened for this keepsake is the one
  // the tab takes you back to.
  var key = 'nanafy_home_' + code.toUpperCase();
  var home = '/keepsake/view/';
  try {
    if (path === '/keepsake/' || path === '/keepsake/view/') localStorage.setItem(key, path);
    home = localStorage.getItem(key) || home;
  } catch (e) {}

  var dest = { memories: home, slideshow: '/keepsake/slideshow/', mosaic: '/keepsake/collage/', book: '/book/' };
  var current = { '/keepsake/': 'memories', '/keepsake/view/': 'memories',
                  '/keepsake/slideshow/': 'slideshow', '/keepsake/collage/': 'mosaic', '/book/': 'book' }[path];

  bar.querySelectorAll('a.tab').forEach(function (a) {
    var t = a.dataset.tab;
    a.href = dest[t] + q;
    if (t === current) a.setAttribute('aria-current', 'page');
  });

  var toast = document.getElementById('tabToast'), toastTimer;
  function say(msg) {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }

  document.getElementById('tabShare').addEventListener('click', function () {
    var url = location.origin + '/keepsake/view/' + q;
    if (navigator.share) {
      navigator.share({ title: 'A keepsake on Nanafy', url: url })
        .catch(function (e) { if (!e || e.name !== 'AbortError') copy(url); });
      return;
    }
    copy(url);
  });
  function copy(url) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { say('Link copied'); },
                                              function () { say(url); });
    } else { say(url); }
  }

  // Pages that know whether photos exist can retire the Mosaic tab.
  window.NanafyTabs = {
    setMosaic: function (has) {
      var m = bar.querySelector('[data-tab="mosaic"]');
      if (!m) return;
      m.hidden = !has;
      bar.style.gridTemplateColumns = 'repeat(' + (has ? 5 : 4) + ',1fr)';
    }
  };

  bar.hidden = false;
  document.body.classList.add('has-tabbar');
})();
</script>
