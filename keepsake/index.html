<style>
  :root {
    --ground: #FBF4EE; --surface: #FFFBF6; --surface-2: #F5E8DE;
    --ink: #2C1D28; --ink-soft: #6A5460; --line: #E7D7CC;
    --plum: #8A3F5C; --turq: #0a786f; --turq-deep: #085d56; --turq-ink: #04302C; --turq-soft: #A9E3DE;
    --shadow: rgba(58, 30, 44, 0.13); --danger: #B23A3A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #1F1620; --surface: #2B1F2C; --surface-2: #362538;
      --ink: #F1E5DC; --ink-soft: #BFA9B2; --line: #3D2E3C;
      --plum: #D68CA7; --turq: #0a786f; --turq-deep: #23a99e; --turq-ink: #eafffb; --turq-soft: #2A5C58;
      --shadow: rgba(0, 0, 0, 0.4); --danger: #F0918C;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    --serif: "Hoefler Text", "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
    background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 26px 20px 72px; }
  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 26px; }
  .brand .mark { font-family: var(--serif); font-size: 1.35rem; font-weight: 600; color: var(--ink-soft); letter-spacing: -0.02em; }
  .brand .mark b { color: var(--turq); }
  .topnav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 26px; }
  .topnav .brand { margin-bottom: 0; text-decoration: none; }
  .tn-links { display: flex; gap: 7px; }
  .tn-links a { font-size: 0.85rem; font-weight: 600; color: var(--turq-deep); text-decoration: none; padding: 7px 12px; border: 1px solid var(--turq-soft); border-radius: 999px; white-space: nowrap; }
  .tn-links a:hover { background: var(--turq); color: var(--turq-ink); border-color: var(--turq); }
  @media (max-width: 430px) { .tn-links a { padding: 6px 9px; font-size: 0.78rem; } }

  .spinner { text-align: center; color: var(--ink-soft); padding: 70px 0; }
  .center { text-align: center; }

  /* header */
  .khead { text-align: center; padding: 6px 0 8px; }
  .khead .prep { font-family: var(--sans); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--plum); margin: 0 0 6px; }
  .khead h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(2rem, 6.4vw, 2.8rem); letter-spacing: -0.01em; line-height: 1.08; margin: 0; text-wrap: balance; }
  .khead .count { color: var(--ink-soft); font-size: 0.98rem; margin-top: 10px; }
  .khead .count b { color: var(--turq-deep); font-family: var(--serif); font-size: 1.1rem; }

  /* gather-more bar */
  .gather { background: var(--surface-2); border-radius: 16px; padding: 14px 16px; margin: 22px 0 30px; }
  .gather .g-t { font-size: 0.9rem; color: var(--ink-soft); margin: 0 0 10px; }
  .gather .g-row { display: flex; gap: 8px; }
  .gather .g-link { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; font-size: 0.85rem; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; }
  .gather .g-copy { flex: none; border: 0; border-radius: 11px; padding: 0 16px; background: var(--turq); color: var(--turq-ink); font: inherit; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
  .gather .g-copy.done { background: var(--surface); color: var(--turq-deep); }

  /* memory cards */
  .mlist { display: grid; gap: 16px; }
  .mcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px 20px 18px; box-shadow: 0 14px 34px -26px var(--shadow); }
  .mcard .who { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .mcard .who .name { font-weight: 700; color: var(--plum); font-size: 1rem; }
  .mcard .who .when { font-size: 0.8rem; color: var(--ink-soft); flex: none; }
  .mcard .q { font-family: var(--serif); font-style: italic; color: var(--ink-soft); font-size: 0.95rem; margin: 10px 0 10px; line-height: 1.4; }
  .mcard .body { font-family: var(--serif); font-size: 1.12rem; line-height: 1.5; color: var(--ink); white-space: pre-wrap; }
  .mcard .photo { margin-top: 14px; }
  /* owner review queue */
  .pending { display: grid; gap: 16px; margin: 0 0 28px; }
  .pending .p-title { font-size: 1.15rem; margin: 0; display: flex; align-items: center; gap: 9px; }
  .pending .p-n { background: var(--turq); color: #fff; border-radius: 999px; font-size: 0.8rem; padding: 2px 10px; }
  .pending .p-sub { color: var(--ink-soft); font-size: 0.9rem; margin: -8px 0 0; line-height: 1.45; }
  .pending .p-sub a { color: var(--turq-deep); font-weight: 600; }
  .mcard.is-pending { border: 1.5px dashed var(--turq); }
  /* photo-batch review grid */
  .pgrid-batch { border: 1.5px dashed var(--turq); border-radius: 10px; padding: 15px; background: var(--surface); }
  .pgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0 12px; }
  .pg-cell { position: relative; padding: 0; border: 3px solid transparent; border-radius: 8px; overflow: hidden; cursor: pointer; background: none; aspect-ratio: 1; }
  .pg-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pg-cell .pg-check { position: absolute; top: 5px; right: 5px; width: 22px; height: 22px; border-radius: 999px; background: var(--turq); color: #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .pg-cell[aria-pressed="false"] { border-color: transparent; opacity: 0.45; }
  .pg-cell[aria-pressed="false"] .pg-check { background: rgba(0,0,0,0.35); }
  .pg-cell[aria-pressed="true"] { border-color: var(--turq); }
  .rvw { display: flex; gap: 10px; margin-top: 16px; }
  .rvw button { flex: 1; border-radius: 999px; padding: 12px 16px; font: inherit; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
  .rvw button:disabled { opacity: 0.55; cursor: default; }
  .rvw .rvw-yes { background: var(--turq); border: 1px solid var(--turq); color: #fff; }
  .rvw .rvw-no { background: none; border: 1px solid var(--line); color: var(--ink); }

  /* empty */

  .btn { width: 100%; margin-top: 14px; border: 0; border-radius: 999px; background: var(--turq); color: var(--turq-ink); font: inherit; font-size: 1.02rem; font-weight: 700; padding: 15px; cursor: pointer; }

  .bc-line { display: block; margin: 10px 0 16px; color: var(--ink); font-size: 0.98rem; }
  .bc-btn { display: inline-block; background: var(--turq); color: #fff; font-weight: 800; font-size: 1rem; padding: 13px 24px; border-radius: 8px; }
  .foot { margin-top: 34px; text-align: center; font-size: 12.5px; color: var(--ink-soft); }
  .foot a { color: var(--turq-deep); text-decoration: none; }

  /* == New theme: bold & friendly, white canvas (light only) — overrides == */
  :root{

  .btn,.submit,.copy-btn,.action,.nav-cta,.topnav-links a,.tn-links a,.g-copy,.nana,.addown,.suggestion,.chip,.mine-banner,input[type="text"],input[type="email"],.p-input,.code-form input,.link-box{ border-radius:8px !important; }

  .khead::before{ content:""; position:absolute; inset:0; background:radial-gradient(70% 90% at 82% 18%, rgba(15,176,164,.32), transparent 65%); }

  .edit-panel[hidden]{ display:none !important; }

  /* --- desktop posture: fill the screen --- */
  .wrap{ max-width:1140px; }

  /* --- header profile chip --- */
  .tn-links a.prof-chip, .prof-chip{ width:34px; height:34px; border-radius:999px !important; background:var(--turq); color:#fff !important; font-weight:800; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; font-size:.95rem; padding:0 !important; border:0 !important; }

  .delete-keepsake{ justify-self:start; margin-top:10px; border:1.5px solid #e5b9b3; background:none; color:var(--danger); font:inherit; font-weight:800; font-size:.9rem; padding:10px 18px; border-radius:8px; cursor:pointer; }
  .delete-keepsake:hover{ background:#fdf1ef; }

  /* ═══ BLACK-ACCENT hero: deep teal field with edge light instead of flat #0f1c1a ═══ */
  .khead{ background:linear-gradient(160deg,#123832 0%,#0a1f1c 55%,#060f0e 100%);
    box-shadow:0 30px 60px -38px rgba(6,15,14,.8), inset 0 1px 0 rgba(255,255,255,.12); }
  .khead::before{ background:
    radial-gradient(70% 90% at 82% 18%, rgba(18,201,187,.38), transparent 65%),
    radial-gradient(40% 55% at 8% 95%, rgba(242,138,176,.12), transparent 70%); }
  .khead-edit{ background:rgba(2,8,10,.35); backdrop-filter:blur(8px); }

  /* memory cards: gentle entrance + lift on the white canvas */
  .mcard{ animation:rise .6s cubic-bezier(.22,.9,.36,1) backwards;
    transition: transform .25s cubic-bezier(.22,.9,.36,1), border-color .25s ease; }
  .mcard:hover{ transform:translateY(-3px); border-color:var(--turq-soft); }
  @keyframes rise{ from{ opacity:0; transform:translateY(22px); } }

  @media(prefers-reduced-motion:reduce){

  /* == PEACOCK: match the app's 2026-08 redesign (final override layer).
     Deep teal ground, white ink, hairline borders, no shadows; Josefin Sans
     announces, Lora holds the words, Lato
     does the work. Mirrors src/constants/theme.ts (palette `peacock`). == */
  :root{
    color-scheme:dark;
    --ground:#115E67; --surface:#0E5259; --surface-2:#0C4A51;
    --ink:#FFFFFF; --ink-soft:rgba(255,255,255,.70); --line:rgba(255,255,255,.22);
    --plum:#5FE0D2; --turq:#5FE0D2; --turq-deep:#5FE0D2; --turq-ink:#073B36; --turq-soft:rgba(95,224,210,.28);
    --shadow:transparent; --danger:#FFB4A6;
    --verm:#FF7A63; --accent-wash:rgba(95,224,210,.12); --line-strong:rgba(255,255,255,.34);
  }
  body{
    --display:"Josefin Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --serif:"Lora",Georgia,serif;
    --sans:"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    font-family:var(--sans);
  }
  h1,h2{ font-family:var(--display) !important; font-weight:300 !important; letter-spacing:.02em !important; }
  .brand .mark{ font-family:var(--display); font-weight:600; letter-spacing:.18em; text-transform:uppercase; font-size:1.15rem; color:#EFA8BE; }
  .brand .mark b{ color:#fff; font-weight:600; }
  .brand svg [fill="#0FB0A4"]{ fill:#FFFFFF; }
  .brand svg [fill="#FFFFFF"]{ fill:var(--ground); }
  .label,.edit-panel .label{ font-family:var(--display); font-weight:600; letter-spacing:.18em; color:var(--turq); }
  .tn-links a{ color:var(--ink); }
  .tn-links a:hover{ color:var(--turq) !important; box-shadow:inset 0 -2px 0 var(--turq); }
  .prof-chip{ background:var(--turq); color:var(--turq-ink) !important; }
  .prof-link{ color:var(--ink); }
  .btn,.g-copy,.code-form input,.refresh{ border-radius:12px !important; }
  .mcard,.gather,.edit-panel,.bookcta,.pgrid-batch{ border-radius:12px !important; }

  /* hero: the peacock deep ground with an accent glow */
  .khead{ background:linear-gradient(160deg,#17727C 0%,#115E67 55%,#0C464D 100%);
    border:1px solid var(--line); box-shadow:none; }
  .khead::before{ background:
    radial-gradient(70% 90% at 82% 18%, rgba(95,224,210,.28), transparent 65%),
    radial-gradient(40% 55% at 8% 95%, rgba(255,122,99,.14), transparent 70%); }
  .khead .prep{ font-family:var(--display); font-weight:600; letter-spacing:.22em; color:var(--turq) !important; }
  .khead h1{ font-family:var(--display) !important; font-weight:600 !important; text-transform:none; letter-spacing:.01em !important;
    line-height:1.08; font-size:clamp(2.2rem,7.5vw,3rem); }
  .khead .count{ color:var(--ink-soft) !important; }
  .khead .count b{ font-family:var(--display); }
  .khead-edit{ background:rgba(7,28,31,.35); border-color:var(--line-strong); font-weight:700; }
  @media(min-width:760px){ .khead h1{ font-size:clamp(2.6rem,5.5vw,4rem); } }

  /* gather bar + memory cards on the teal ground */
  .gather{ background:var(--surface); border:1px solid var(--line); }
  .gather .g-t{ color:var(--ink-soft); }
  .gather .g-link{ background:var(--surface-2); border-color:var(--line); color:var(--ink); }

  .gather .g-copy.done{ background:var(--surface-2); color:var(--turq); }

  .mcard{ background:var(--surface); border:1px solid var(--line); box-shadow:none; }

  .mcard .q{ color:var(--ink-soft); }

  .pending .p-sub a{ color:var(--turq); }
  .pg-cell[aria-pressed="true"]{ border-color:var(--turq); }
  .pg-cell .pg-check{ background:var(--turq); color:var(--turq-ink); }
  .rvw .rvw-yes{ background:var(--turq); border-color:var(--turq); color:var(--turq-ink); }
  .rvw .rvw-no{ border-color:var(--line-strong); color:var(--ink); }
  .m-remove{ color:var(--ink-soft); }

  /* edit panel + code entry + book CTA */
  .edit-panel{ background:var(--surface); border-color:var(--line); }

  .edit-panel input[type="file"]{ color:var(--ink-soft); }
  .ep-num{ background:var(--accent-wash); color:var(--turq); }
  .ep-add{ border-color:var(--line-strong); color:var(--turq); }
  .ep-rm,.edit-cancel{ color:var(--ink-soft); }
  .remove-photo{ color:var(--danger); }

  .delete-keepsake:hover{ background:rgba(255,122,99,.12); }
  .code-form input{ background:var(--surface-2); color:var(--ink); border-color:var(--line); font-family:var(--display); font-weight:600; }
  input::placeholder{ color:rgba(255,255,255,.45); }
  .btn{ background:var(--turq); color:var(--turq-ink); }
  .refresh{ background:none; border-color:var(--line-strong); color:var(--ink); }
  .bookcta{ background:var(--surface); border:1px solid var(--line); box-shadow:none; }
  .bookcta:hover{ border-color:var(--turq); }
  .bc-kicker{ font-family:var(--display); font-weight:600; letter-spacing:.2em; color:var(--verm); }
  .bc-line{ color:var(--ink-soft); }
  .bc-btn{ background:var(--turq); color:var(--turq-ink); font-weight:700; border-radius:12px; }
  .empty h2{ color:var(--ink); }
  .empty p{ color:var(--ink-soft); }
  .foot a{ color:var(--turq); }


  /* --- skeletons ----------------------------------------------------------
     A shape where the content will be, instead of the word "Loading". The
     wait is the same length; it stops being a blank screen followed by a pop.
     Sizes deliberately match the real thing so nothing jumps when it lands. */
  @keyframes skShimmer { 100% { transform: translateX(100%); } }
  @keyframes skFade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .sk { position:relative; overflow:hidden; border-radius:10px; background:rgba(255,255,255,.07); }
  .sk::after {
    content:""; position:absolute; inset:0; transform:translateX(-100%);
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
    animation:skShimmer 1.6s ease-in-out infinite;
  }
  .sk-line { height:15px; margin:0 0 11px; }
  .sk-line:last-child { margin-bottom:0; }
  .sk-line.tall { height:30px; margin-bottom:16px; }
  .sk-line.w90{ width:90% } .sk-line.w75{ width:75% } .sk-line.w60{ width:60% } .sk-line.w40{ width:40% } .sk-line.w25{ width:25% }
  .sk-line.mid { margin-left:auto; margin-right:auto; }
  .sk-card { border:1px solid var(--line); border-radius:14px; padding:20px; margin:0 0 14px; }
  .sk-block { border-radius:12px; }
  .sk-wrap { animation:skFade .3s ease both; }
  /* Content replacing a skeleton eases in rather than snapping. */
  .did-load { animation:skFade .34s cubic-bezier(.22,.9,.36,1) both; }
  @media (prefers-reduced-motion: reduce) {
    .sk::after { animation:none; }
    .sk-wrap, .did-load { animation:none; }
  }



  /* --- thumb-sized hit areas on text links -------------------------------
     A 15px link is fine to read and hard to hit. These keep their size and
     their place in the sentence; only the area that responds to a tap grows,
     via a pseudo-element, so nothing reflows. */
  .foot a, .khead-edit { position:relative; display:inline-block; }
  .foot a, .khead-edit::after {
    content:""; position:absolute; left:-10px; right:-10px; top:50%;
    height:44px; transform:translateY(-50%);
  }

  /* --- thumb-sized header controls ----------------------------------------
     The shared header links measured 24-31px of reachable height. They now
     clear 44px without the labels changing size: the row grows, the type
     doesn't. */
  .topnav .brand, .tn-links a, .tn-links .prof-link { min-height:44px; display:inline-flex; align-items:center; }
  /* --- the host's welcome --------------------------------------------------
     A rented guestbook phone plays the couple's greeting before the beep, and
     the whole trade agrees a stiff or absent greeting gets stiff or absent
     messages back. Lives next to the share tools, because that is where a host
     is already thinking about getting people to contribute. */
  .welcome-card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:15px 16px; margin:0 0 22px; }
  .welcome-card .w-t { font-family:var(--display); font-size:.7rem; font-weight:600; letter-spacing:.18em;
    text-transform:uppercase; color:var(--turq); margin:0 0 4px; }
  .welcome-card .w-sub { font-size:.86rem; color:var(--ink-soft); margin:0 0 12px; line-height:1.45; }
  .w-btn {
    display:flex; align-items:center; justify-content:center; gap:9px; width:100%;
    border:0; border-radius:12px; background:var(--verm, #FF7A63); color:#2A0D06;
    font:inherit; font-weight:700; font-size:1rem; padding:14px; cursor:pointer;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1), opacity .15s ease;
  }
  .w-btn.stop { background:var(--ink); color:var(--ground); }
  .w-btn:active:not(:disabled) { transform:scale(.965); }
  .w-btn:disabled { opacity:.6; cursor:default; }
  .w-dot { flex:none; width:12px; height:12px; border-radius:999px; background:#2A0D06; }
  .w-btn.stop .w-dot { border-radius:2px; background:var(--verm, #FF7A63); animation:wPulse 1.1s ease-in-out infinite; }
  @keyframes wPulse { 0%,100%{opacity:1} 50%{opacity:.2} }
  .w-time { font-variant-numeric:tabular-nums; }
  .w-have { display:flex; align-items:center; gap:10px; }
  .w-have audio { flex:1; min-width:0; height:40px; color-scheme:dark; }
  .w-mini { flex:none; border:1px solid var(--line-strong); border-radius:999px; background:none; color:var(--ink);
    font:inherit; font-size:.8rem; font-weight:700; padding:8px 13px; cursor:pointer; }
  .w-mini:hover { border-color:var(--turq); color:var(--turq); }
  .w-note { font-size:.8rem; color:var(--ink-soft); margin:10px 0 0; min-height:1.1em; }
  .w-note.err { color:var(--danger); }
  @media (prefers-reduced-motion: reduce) { .w-btn.stop .w-dot { animation:none; } .w-btn:active { transform:none; } }

  /* --- when & where ---------------------------------------------------------
     A guest who scans the code on the order of service usually wants the thing
     the paper card already told them: when it starts and where it is. Only
     rendered when the host filled something in. */
  .when-card {
    border:1px solid var(--line); border-radius:14px; background:var(--surface-2, rgba(255,255,255,.05));
    padding:16px 18px; margin:0 0 22px; text-align:center;
  }

  /* --- the keepsake tab bar ------------------------------------------------
     The keepsake, the slideshow, the mosaic and the book used to be four
     separate destinations you reached through cards and "back" links. They
     are four views of one thing, so they get one bar that never moves. It is
     static HTML, so it paints with the page rather than after the fetch. */
  .tabbar {
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    display:grid; grid-template-columns:repeat(5,1fr);
    background:color-mix(in srgb, var(--surface, #0E5259) 92%, transparent);

    padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none;
    transition: opacity .2s ease, transform .2s cubic-bezier(.22,.9,.36,1);
  }
  .tab-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  /* room for the bar, so nothing hides behind it */
  body.has-tabbar { padding-bottom:calc(74px + env(safe-area-inset-bottom)); }
  body.has-tabbar .back { display:none; }

     Cross-document view transitions: moving between the keepsake, the mosaic
     and the book cross-fades instead of blinking white. The tab bar and the
     site header are named, so they stay put while the content underneath

<script>
const SUPABASE_URL = Nanafy.SUPABASE_URL;
const ANON_KEY = Nanafy.ANON_KEY;
const HEADERS = { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY };
const PREPOSITIONS = { memorial: 'In memory of', wedding: 'Celebrating', birthday: 'Celebrating', graduation: 'Congratulating', tribute: 'A tribute to', other: 'For' };

const BLOOM_WM = '<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="rgba(255,255,255,.13)"><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(0 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(30 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(60 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(90 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(120 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(150 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(180 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(210 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(240 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(270 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(300 50 50)"/><path d="M50 5 C59 15 59 27 50 37 C41 27 41 15 50 5 Z" transform="rotate(330 50 50)"/><circle cx="50" cy="50" r="18.5"/></g></svg>';
const app = document.getElementById('app');
let code = '';

// Signed-in session (if any) — read from the session Supabase stores locally,
// same trick as the header profile chip. Lets a keepsake's owner edit it and
// moderate pending memories from the web; RLS requires their token for both.
function session() {
  try {
    const raw = localStorage.getItem('sb-vigenqlwwoknxjzahvtv-auth-token');
    if (raw) {
      const s = JSON.parse(raw);
      const token = s.access_token || (s.currentSession && s.currentSession.access_token);
      const user = s.user || (s.currentSession && s.currentSession.user);
      if (token && user) return { token: token, userId: user.id };
    }
  } catch (e) {}
  // Anonymous hosts: a keepsake created signed-out is owned by this device's
  // anonymous session — same owner powers, from the same browser. Without
  // this, their guests' memories would wait in a queue nobody can see.
  try {
    const a = JSON.parse(localStorage.getItem('nanafy_anon_session') || 'null');
    if (a && a.access_token && a.userId && (a.expires_at || 0) - 60 > Date.now() / 1000) {
      return { token: a.access_token, userId: a.userId };
    }
  } catch (e) {}
  return null;
}
function authHeaders() {
  const s = session();
  return s ? Object.assign({}, HEADERS, { Authorization: 'Bearer ' + s.token }) : HEADERS;
}

// The shape the page ships with, reused on every refetch.
const SKELETON_KEEPSAKE = document.getElementById('app').innerHTML;

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function ownsThis(ev) {
  const s = session();
  return !!(s && ev && ev.owner_id && ev.owner_id === s.userId);
}


// --- when & where ---------------------------------------------------------
var CAL_GLYPH = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>';
var PIN_GLYPH = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>';
// A plain `date` column, formatted in the reader's own locale. Parsed as
// local noon so a UTC-midnight date never slips to the day before.
function niceEventDate(d) {
  if (!d) return '';
  var p = String(d).split('-');
  if (p.length !== 3) return String(d);
  var dt = new Date(+p[0], +p[1] - 1, +p[2], 12);
  if (isNaN(dt)) return String(d);
  return dt.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}
function whenCard(ev) {
  var when = [niceEventDate(ev.event_date), (ev.event_time || '').trim()].filter(Boolean).join(' at ');
  var place = (ev.event_location || '').trim();
  if (!when && !place) return '';
  return '<div class="when-card"><p class="wc-kicker">Where and when</p>' +
    (when ? '<p class="wc-row">' + CAL_GLYPH + '<span>' + esc(when) + '</span></p>' : '') +
    (place ? '<p class="wc-row">' + PIN_GLYPH + '<span>' + esc(place) + '</span></p>' : '') +
    '</div>';
}

// --- the host's welcome ------------------------------------------------------
// Same recording rules as the guest page: prefer MP4/AAC so a welcome recorded
// on Android still plays on an iPhone. Uploaded the moment it stops, then
// PATCHed onto the event — there is no form to submit, so nothing to lose.
function pickWelcomeMime() {
  const wanted = ['audio/mp4', 'audio/mp4;codecs=mp4a.40.2', 'audio/aac', 'audio/webm;codecs=opus', 'audio/webm'];
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
  for (let i = 0; i < wanted.length; i++) if (MediaRecorder.isTypeSupported(wanted[i])) return wanted[i];
  return '';
}
function welcomeExt(t) {
  if (t.indexOf('mp4') > -1 || t.indexOf('aac') > -1) return 'm4a';
  if (t.indexOf('webm') > -1) return 'webm';
  if (t.indexOf('ogg') > -1) return 'ogg';
  return 'bin';
}

function wireWelcome(ev) {
  const card = document.getElementById('welcomeCard');
  if (!card) return;
  const bodyEl = document.getElementById('welcomeBody');
  const note = document.getElementById('welcomeNote');
  const MAX = 60; // a welcome, not a eulogy
  const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);

  let url = ev.welcome_audio_url || null;
  let secs = ev.welcome_audio_seconds || 0;
  let rec = null, stream = null, timer = null, started = 0, recording = false, busy = false;

  function say(msg, isErr) { note.className = 'w-note' + (isErr ? ' err' : ''); note.textContent = msg || ''; }

  function draw() {
    if (!canRecord && !url) {
      bodyEl.innerHTML = '<p class="w-sub" style="margin:0">This browser can\u2019t record. Open the keepsake ' +
        'on your phone to leave a welcome.</p>';
      return;
    }
    if (recording) {
      bodyEl.innerHTML = '<button type="button" class="w-btn stop" id="wBtn"><span class="w-dot"></span>' +
        '<span>Stop \u00b7 <span class="w-time" id="wTime">0:00</span></span></button>';
      return;
    }
    if (url) {
      bodyEl.innerHTML = '<div class="w-have"><audio controls preload="none" data-media="' + esc(url) + '"></audio>' +
        '<button type="button" class="w-mini" id="wRedo">Redo</button>' +
        '<button type="button" class="w-mini" id="wDrop">Remove</button></div>';
      return;
    }
    bodyEl.innerHTML = '<button type="button" class="w-btn" id="wBtn"><span class="w-dot"></span>' +
      '<span>Record a welcome</span></button>';
  }

  async function save(patch, msg) {
    busy = true;
    const res = await fetch(SUPABASE_URL + '/rest/v1/events?share_code=eq.' + encodeURIComponent(code.toUpperCase()), {
      method: 'PATCH',
      headers: Object.assign({}, authHeaders(), { 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
      body: JSON.stringify(patch)
    });
    busy = false;
    if (!res.ok) throw new Error('save');
    say(msg);
  }

  async function start() {
    say('');
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { say('Your browser blocked the microphone. Allow it, then try again.', true); return; }
    const mime = pickWelcomeMime();
    try { rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); }
    catch (e) { rec = new MediaRecorder(stream); }
    const chunks = [], mimeUsed = rec.mimeType || mime;
    rec.addEventListener('dataavailable', (e) => { if (e.data && e.data.size) chunks.push(e.data); });
    rec.addEventListener('stop', async () => {
      const seconds = Math.max(1, Math.round((Date.now() - started) / 1000));
      clearInterval(timer); timer = null; recording = false; rec = null;
      if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
      const type = (mimeUsed || 'audio/mp4').split(';')[0];
      const blob = new Blob(chunks, { type: type });
      if (!blob.size) { draw(); return; }
      draw(); say('Saving\u2026');
      try {
        const path = ev.id + '/welcome-' + Date.now().toString(36) + '.' + welcomeExt(type);
        const up = await fetch(SUPABASE_URL + '/storage/v1/object/memory-audio/' + path, {
          method: 'POST', headers: Object.assign({}, HEADERS, { 'Content-Type': type }), body: blob
        });
        if (!up.ok) throw new Error('upload');
        const publicUrl = SUPABASE_URL + '/storage/v1/object/public/memory-audio/' + path;
        await save({ welcome_audio_url: publicUrl, welcome_audio_seconds: seconds },
                   'Saved \u2014 guests hear this before they answer.');
        url = publicUrl; secs = seconds; ev.welcome_audio_url = url; ev.welcome_audio_seconds = secs;
        draw();
      } catch (e) {
        say('That didn\u2019t save. Check your connection and record it again.', true);
        draw();
      }
    });
    started = Date.now(); recording = true; rec.start(); draw();
    timer = setInterval(() => {
      const n = Math.floor((Date.now() - started) / 1000);
      const t = document.getElementById('wTime');
      if (t) t.textContent = Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
      if (n >= MAX) stop();
    }, 250);
  }
  function stop() { if (rec && rec.state !== 'inactive') rec.stop(); }

  card.addEventListener('click', async (e) => {
    if (busy) return;
    if (e.target.closest('#wBtn')) { recording ? stop() : start(); return; }
    if (e.target.closest('#wRedo')) { url = null; draw(); say(''); start(); return; }
    if (e.target.closest('#wDrop')) {
      say('Removing\u2026');
      try {
        await save({ welcome_audio_url: null, welcome_audio_seconds: null }, 'Removed.');
        url = null; secs = 0; ev.welcome_audio_url = null; ev.welcome_audio_seconds = null;
        draw();
      } catch (err) { say('Couldn\u2019t remove it \u2014 try again.', true); }
    }
  });

  draw();
}

// --- voice memories --------------------------------------------------------
// A recording renders as its own block in the card. Written memories are
// unchanged; a spoken one simply has no body to show.
const VOICE_GLYPH = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">' +
  '<path d="M4 10v4M9 6v12M14 3v18M19 9v6"/></svg>';
function mmss(n) { n = Math.max(0, Math.round(n || 0)); return Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0'); }
function voiceBlock(m) {
  if (!m.audio_url) return '';
  const who = m.contributor_name || 'Anonymous';
  const len = m.audio_seconds ? ' \u00b7 ' + mmss(m.audio_seconds) : '';
  return '<div class="voice"><div class="voice-tag">' + VOICE_GLYPH +
    '<span>' + esc(who) + '\u2019s voice' + len + '</span></div>' +
    '<audio controls preload="none" data-media="' + esc(m.audio_url) + '"></audio></div>';
}
function bodyBlock(m) {
  return (m.body || '').trim() ? '<div class="body">' + esc(m.body) + '</div>' : '';
}

// Gently fold a decided card away — no page refresh, nothing else moves.
// The next card simply slides up to meet the host.
function collapse(el, then) {
  el.style.overflow = 'hidden';
  el.style.height = el.offsetHeight + 'px';
  el.style.transition = 'height .3s ease, opacity .25s ease, margin .3s ease, padding .3s ease';
  requestAnimationFrame(function () {
    el.style.height = '0'; el.style.opacity = '0';
    el.style.marginTop = '0'; el.style.marginBottom = '0';
    el.style.paddingTop = '0'; el.style.paddingBottom = '0';
  });
  setTimeout(function () { el.remove(); if (then) then(); }, 320);
}

// Tick the review-queue badge down after a decision; when the queue is
// empty, fold the whole section away.
function queueShrunk(by) {
  const badge = document.querySelector('.pending .p-n');
  if (badge) {
    const n = Math.max(0, (parseInt(badge.textContent, 10) || 0) - by);
    badge.textContent = n;
  }
  const box = document.querySelector('.pending');
  if (box && !box.querySelector('.mcard.is-pending') && !box.querySelector('.pgrid-batch')) {
    collapse(box);
  }
}

function when(iso) {
  const d = new Date(iso), now = new Date();
  const mins = Math.round((now - d) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24 && d.toDateString() === now.toDateString()) return hrs + (hrs === 1 ? ' hour ago' : ' hours ago');
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

async function fetchKeepsake(c) {
  // The join RPC records membership and returns the event; the memories embed
  // then only contains approved ones (RLS), which is the keepsake view.
  const ev = await Nanafy.join(c,
    'id,title,honoree,event_type,event_date,event_time,event_location,welcome_audio_url,welcome_audio_seconds,photo_url,owner_id,prompts(text,position),memories(id,status,contributor_name,prompt_text,body,photo_url,audio_url,audio_seconds,created_at)');
  // Owners can read every status; the keepsake grid shows only approved.
  if (ev && Array.isArray(ev.memories)) ev.memories = ev.memories.filter((m) => m.status === 'approved');
  return ev;
}

// The owner's review queue. Returns [] for everyone else (and skips the
// request entirely unless the signed-in user owns this keepsake). Returns
// 'stale' when the stored session has expired, so the page can say so
// instead of silently hiding the queue.
async function fetchPending(ev) {
  const s = session();
  if (!s || !ev.owner_id || ev.owner_id !== s.userId) return [];
  const q = SUPABASE_URL + '/rest/v1/memories?event_id=eq.' + ev.id +
    '&status=eq.pending&order=created_at.asc&select=id,contributor_name,prompt_text,body,photo_url,audio_url,audio_seconds,created_at';
  const res = await fetch(q, { headers: authHeaders() });
  if (res.status === 401) return 'stale';
  if (!res.ok) return [];
  return res.json();
}

    html += '<div class="mlist">' + memories.map(function (m) {
      return '<div class="mcard" data-mid="' + esc(m.id) + '">' +
        '<div class="who"><span class="name">' + esc(m.contributor_name || 'Anonymous') + '</span>' +
        '<span class="when">' + esc(when(m.created_at)) + '</span></div>' +

        voiceBlock(m) +

        (isOwner
          ? '<div class="m-tools">' +

            '<button type="button" class="m-remove" data-remove>Remove from keepsake</button>' +

    }).join('') + '</div>';

      '<span class="bc-btn">See the book</span></a>';

  document.getElementById('refresh').addEventListener('click', function () { start(code); });

  // Photo batches: tap to select, then approve/decline the selection in one

  Array.prototype.forEach.call(app.querySelectorAll('.pg-cell'), function (cell) {

      const batch = btn.closest('.pgrid-batch');
      const ids = Array.prototype.map.call(batch.querySelectorAll('.pg-cell[aria-pressed="true"]'), function (c) { return c.dataset.mid; });
      if (!ids.length) return;
      const decision = btn.hasAttribute('data-batch-approve') ? 'approved' : 'rejected';
      Array.prototype.forEach.call(batch.querySelectorAll('button'), function (b) { b.disabled = true; });
      btn.textContent = decision === 'approved' ? 'Approving…' : 'Declining…';
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/memories?id=in.(' + ids.map(encodeURIComponent).join(',') + ')', {
          method: 'PATCH',
          headers: Object.assign({}, authHeaders(), { 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
          body: JSON.stringify({ status: decision })
        });
        if (!res.ok) throw new Error('batch');
        const cells = batch.querySelectorAll('.pg-cell[aria-pressed="true"]');
        const remaining = batch.querySelectorAll('.pg-cell').length - cells.length;
        if (remaining === 0) {
          // whole batch decided — fold it away as one
          collapse(batch, function () { queueShrunk(ids.length); });

          batch.querySelector('[data-batch-decline]').textContent = 'Decline selected';
          batch.querySelector('.who .when').textContent = remaining + ' photo' + (remaining > 1 ? 's' : '');

            Array.prototype.forEach.call(batch.querySelectorAll('.pg-cell'), function (c) { c.setAttribute('aria-pressed', 'true'); });
          }, 280);
        }
      } catch (e) {
        Array.prototype.forEach.call(batch.querySelectorAll('button'), function (b) { b.disabled = false; });
        btn.textContent = decision === 'approved' ? 'Approve selected (' + ids.length + ')' : 'Decline selected';
      }

  // Approve / decline pending memories (owner only — the buttons only render

          body: JSON.stringify({ status: decision })
        });
        if (!res.ok) throw new Error('decide');
        collapse(card, function () { queueShrunk(1); }); // no refresh — nothing else moves
      } catch (e) {
        Array.prototype.forEach.call(card.querySelectorAll('button'), function (b) { b.disabled = false; });
        btn.textContent = decision === 'approved' ? 'Approve' : 'Decline';
      }
    });
  });

  // Owner removes a visible memory: same rejected-not-deleted state the

  Array.prototype.forEach.call(app.querySelectorAll('[data-remove]'), function (btn) {

          body: JSON.stringify({ status: 'rejected' })
        });

      } catch (e) {
        btn.disabled = false; btn.textContent = 'Remove from keepsake';

  // Owner strips just the photo from a memory; the words stay. (The photo

          method: 'PATCH',
          headers: Object.assign({}, authHeaders(), { 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
          body: JSON.stringify({ photo_url: null })
        });
        if (!res.ok) throw new Error('removePhoto');
        const ph = card.querySelector('.photo');
        if (ph) collapse(ph);
        btn.remove(); // the photo is gone; so is its button
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Remove the photo';
      }
    });
  });

  // --- edit keepsake ---
  var panel = document.getElementById('editPanel');
  document.getElementById('editBtn').addEventListener('click', function () {
    panel.hidden = !panel.hidden;
    if (!panel.hidden) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  document.getElementById('editCancel').addEventListener('click', function () { panel.hidden = true; });
  document.getElementById('deleteBtn').addEventListener('click', async function () {
    var name = ev.honoree || ev.title || 'this keepsake';
    if (!window.confirm('Delete the keepsake for ' + name + '?\n\nEvery memory and photo in it will be gone for good. This cannot be undone.')) return;
    if (!window.confirm('Really delete it forever?')) return;
    var btn = this; btn.disabled = true; btn.textContent = 'Deleting…';
    try {
      var res = await fetch(SUPABASE_URL + '/rest/v1/events?id=eq.' + ev.id, { method: 'DELETE', headers: authHeaders() });
      if (!res.ok) throw new Error('delete');
      try {
        var list = JSON.parse(localStorage.getItem('nanafy_keepsakes') || '[]');
        localStorage.setItem('nanafy_keepsakes', JSON.stringify(list.filter(function (k) { return (k.code || '').toUpperCase() !== code.toUpperCase(); })));
      } catch (e) {}
      location.href = '/mine/';
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Delete this keepsake…';
      document.getElementById('editErr').textContent = "Couldn't delete. Check your connection and try again.";
    }
  });
  var editPromptList = (ev.prompts || []).slice().sort(function(a,b){ return a.position - b.position; }).map(function(p){ return p.text; });
  function renderEditPrompts(){
    var box = document.getElementById('editPrompts');
    box.innerHTML = editPromptList.map(function(p, i){
      return '<div class="ep-row"><span class="ep-num">' + (i + 1) + '</span>' +
        '<textarea class="ep-input" rows="2" data-i="' + i + '">' + esc(p) + '</textarea>' +
        '<button class="ep-rm" type="button" data-rm="' + i + '" aria-label="Remove question">\u2715</button></div>';
    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('.ep-input'), function(ta){
      ta.addEventListener('input', function(){ editPromptList[+ta.dataset.i] = ta.value; });
    });
    Array.prototype.forEach.call(box.querySelectorAll('.ep-rm'), function(btn){
      btn.addEventListener('click', function(){ editPromptList.splice(+btn.dataset.rm, 1); renderEditPrompts(); });
    });
  }
  renderEditPrompts();
  document.getElementById('editAddPrompt').addEventListener('click', function(){
    editPromptList.push(''); renderEditPrompts();
  });

  var removePhoto = false;
  var removeBtn = document.getElementById('editRemovePhoto');
  if (removeBtn) removeBtn.addEventListener('click', function () {
    removePhoto = !removePhoto;
    removeBtn.textContent = removePhoto ? 'Photo will be removed — undo' : 'Remove current photo';
    removeBtn.classList.toggle('armed', removePhoto);
  });
  document.getElementById('editSave').addEventListener('click', async function () {
    var btn = this, errEl = document.getElementById('editErr');
    var name = document.getElementById('editName').value.trim();
    if (!name) { errEl.textContent = 'Please keep a name.'; return; }
    btn.disabled = true; btn.textContent = 'Saving…'; errEl.textContent = '';
    try {
      var patch = {
        honoree: name,
        title: document.getElementById('editTitle').value.trim() || null,
        event_date: document.getElementById('editDate').value || null,
        event_time: document.getElementById('editTime').value.trim() || null,
        event_location: document.getElementById('editPlace').value.trim() || null,
      };
      if (removePhoto) patch.photo_url = null;
      var file = document.getElementById('editPhoto').files[0];
      if (file) {
        var ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
        // Never the share code: that is the credential, and a path travels.
        var path = ev.id + '/cover-' + Date.now().toString(36) + '.' + ext;
        var up = await fetch(SUPABASE_URL + '/storage/v1/object/memory-photos/' + path, {
          method: 'POST',
          headers: Object.assign({}, HEADERS, { 'Content-Type': file.type || 'image/jpeg' }),
          body: file
        });
        if (!up.ok) throw new Error('upload');
        patch.photo_url = SUPABASE_URL + '/storage/v1/object/public/memory-photos/' + path;
      }
      var res = await fetch(SUPABASE_URL + '/rest/v1/events?share_code=eq.' + encodeURIComponent(code.toUpperCase()), {
        method: 'PATCH',
        headers: Object.assign({}, authHeaders(), { 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
        body: JSON.stringify(patch)
      });
      if (!res.ok) throw new Error('save');

      // Replace the question list (keep at least one non-empty question).
      var cleaned = editPromptList.map(function(t){ return (t || '').trim(); }).filter(Boolean);
      if (cleaned.length) {
        var del = await fetch(SUPABASE_URL + '/rest/v1/prompts?event_id=eq.' + ev.id, {
          method: 'DELETE', headers: authHeaders()
        });
        if (!del.ok) throw new Error('prompts');
        var ins = await fetch(SUPABASE_URL + '/rest/v1/prompts', {
          method: 'POST',
          headers: Object.assign({}, authHeaders(), { 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
          body: JSON.stringify(cleaned.map(function(text, i){ return { event_id: ev.id, text: text, position: i }; }))
        });
        if (!ins.ok) throw new Error('prompts');
      }
      start(code);
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Save changes';
      errEl.textContent = "Couldn't save. Check your connection and try again.";
    }
  });
}

// keepScroll: refreshes after an approve/decline stay exactly where the
// host was reading — the queue shrinks under the cursor instead of
// bouncing back to the top of the page.
async function start(c, keepScroll) {
  code = c;
  const y = keepScroll ? window.scrollY : 0;
  if (!keepScroll) app.innerHTML = SKELETON_KEEPSAKE;
  try {
    const ev = await fetchKeepsake(c);
    if (!ev) return renderCodeEntry('No keepsake found with code ' + c.toUpperCase() + '. Double-check it and try again.');
    const pending = await fetchPending(ev);
    const u = new URL(location.href);
    u.searchParams.set('c', c.toUpperCase());
    history.replaceState(null, '', u);
    render(ev, pending);
    window.scrollTo(0, keepScroll ? Math.min(y, document.body.scrollHeight) : 0);
  } catch {
    if (!keepScroll) renderCodeEntry("Couldn't reach the server. Check your connection and try again.");
  }
}

const initial = new URLSearchParams(location.search).get('c');
if (initial && initial.trim().length === 6) start(initial.trim());
else renderCodeEntry();
</script>

<script>
/* The keepsake tab bar. Runs inline so the bar is wired before first paint. */
(function () {
  var bar = document.getElementById('tabbar');
  if (!bar) return;
  var code = (new URLSearchParams(location.search).get('c') || '').trim();
  if (!code) return;                     // no keepsake in the URL, no bar
  var q = '?c=' + encodeURIComponent(code);
  var path = location.pathname.replace(/\/*$/, '/');

  // "Memories" means the host's own page for the host and the public view for
  // everyone else. Whichever one you last opened for this keepsake is the one
  // the tab takes you back to.
  var key = 'nanafy_home_' + code.toUpperCase();
  var home = '/keepsake/view/';
  try {
    if (path === '/keepsake/' || path === '/keepsake/view/') localStorage.setItem(key, path);
    home = localStorage.getItem(key) || home;
  } catch (e) {}

  var dest = { memories: home, slideshow: '/keepsake/slideshow/', mosaic: '/keepsake/collage/', book: '/book/' };
  var current = { '/keepsake/': 'memories', '/keepsake/view/': 'memories',
                  '/keepsake/slideshow/': 'slideshow', '/keepsake/collage/': 'mosaic', '/book/': 'book' }[path];

  bar.querySelectorAll('a.tab').forEach(function (a) {
    var t = a.dataset.tab;
    a.href = dest[t] + q;
    if (t === current) a.setAttribute('aria-current', 'page');
  });

  var toast = document.getElementById('tabToast'), toastTimer;
  function say(msg) {
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }

  document.getElementById('tabShare').addEventListener('click', function () {
    var url = location.origin + '/keepsake/view/' + q;
    if (navigator.share) {
      navigator.share({ title: 'A keepsake on Nanafy', url: url })
        .catch(function (e) { if (!e || e.name !== 'AbortError') copy(url); });
      return;
    }
    copy(url);
  });
  function copy(url) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { say('Link copied'); },
                                              function () { say(url); });
    } else { say(url); }
  }

  // Pages that know whether photos exist can retire the Mosaic tab.
  window.NanafyTabs = {
    setMosaic: function (has) {
      var m = bar.querySelector('[data-tab="mosaic"]');
      if (!m) return;
      m.hidden = !has;
      bar.style.gridTemplateColumns = 'repeat(' + (has ? 5 : 4) + ',1fr)';
    }
  };

  bar.hidden = false;
  document.body.classList.add('has-tabbar');
})();
</script>
