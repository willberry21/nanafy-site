<style>
  /*
   * The "peacock" design system — matches the app's 2026-08 redesign
   * (src/constants/theme.ts in the app repo): deep Pantone-5473 teal ground,
   * white ink, hairline borders instead of shadows, bright turquoise accent
   * (the brand's #0FB0A4 only carries ~2:1 on this ground), vermilion for
   * warm moments. Fonts follow the app's wedding-invitation split:
   * Josefin Sans announces, Lora holds the
   * memories, Lato does the work.
   */
  :root {
    color-scheme: dark;
    --ground:#115E67; --surface:#14676F; --surface-2:#0E5259; --field:#0C4A51;
    --ink:#FFFFFF; --ink-soft:rgba(255,255,255,.70); --ink-faint:rgba(255,255,255,.45);
    --line:rgba(255,255,255,.18); --line-strong:rgba(255,255,255,.34);
    --accent:#5FE0D2; --accent-ink:#073B36; --accent-wash:rgba(95,224,210,.12);
    --verm:#FF7A63; --danger:#FFB4A6;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    --display:"Josefin Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --serif:"Lora",Georgia,serif;
    --sans:"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 20px 64px; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 30px; }
  .brand .bloom [fill="#0FB0A4"] { fill: #FFFFFF; }
  .brand .bloom [fill="#FFFFFF"] { fill: var(--ground); }
  .brand .mark { font-family: var(--display); font-size: 1.25rem; font-weight: 600; color: #EFA8BE; letter-spacing: .18em; text-transform: uppercase; }
  .brand .mark b { color: var(--ink); font-weight: 600; }
  .center { text-align: center; }
  .prep { font-family: var(--display); font-size: .75rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
  h1 { font-family: var(--display); font-weight: 300; font-size: clamp(1.9rem, 6vw, 2.4rem); letter-spacing: .02em; line-height: 1.14; margin: 0 0 10px; text-wrap: balance; }
  h1.honoree { font-family: var(--display); font-weight: 600; font-size: clamp(2.1rem, 7vw, 2.8rem); letter-spacing: .01em; line-height: 1.1; }
  .sub { font-size: 1rem; color: var(--ink-soft); margin: 0 0 26px; }
  .label { display: block; font-family: var(--display); font-size: .72rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin: 26px 0 9px; }
  .prompts { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
  .prompt-num {
    flex: none; width: 42px; height: 42px; border-radius: 999px; border: 1px solid var(--line-strong);
    background: none; color: var(--ink); font-family: var(--sans); font-size: 15px; font-weight: 700; cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .prompt-num.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .prompt-num.done:not(.sel) { background: var(--accent-wash); border-color: var(--accent); color: var(--accent); }
  .gate-hint { text-align: center; font-size: 13.5px; color: var(--ink-soft); margin: 26px 0 -18px; transition: opacity .25s ease; }

  /* --- motion: the app's press-spring and screen-transition feel --- */
  button { -webkit-tap-highlight-color: transparent; }
  .prompt-num, .submit, .again, .lane-tab, .photo-btn, .cell-add, .cell-x, .promo-btn {
    transition: transform .15s cubic-bezier(.34,1.56,.64,1), border-color .15s ease, background .15s ease, color .15s ease, opacity .15s ease;
  }
  .prompt-num:active, .lane-tab:active, .cell-add:active, .cell-x:active { transform: scale(.9); }
  .submit:active:not(:disabled), .again:active, .photo-btn:active, .promo-btn:active { transform: scale(.975); }
  @keyframes pillPop { 0% { transform: scale(1); } 45% { transform: scale(1.22); } 100% { transform: scale(1); } }
  .prompt-num.pop { animation: pillPop .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes btnReady { 0% { transform: scale(1); } 40% { transform: scale(1.035); } 100% { transform: scale(1); } }
  .submit.ready { animation: btnReady .45s cubic-bezier(.34,1.56,.64,1); }
  .qpane { transition: opacity .16s ease, transform .16s ease; }
  .qpane.swap { opacity: 0; transform: translateY(10px); }
  @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .rise { animation: riseIn .42s cubic-bezier(.22,.9,.36,1) both; }
  .pick-grid .cell, .pick-grid .cell-add { animation: riseIn .3s cubic-bezier(.22,.9,.36,1) both; }
  @media (prefers-reduced-motion: reduce) {
    .prompt-num, .submit, .again, .lane-tab, .photo-btn, .cell-add, .cell-x, .promo-btn, .qpane { transition: none; }
    .prompt-num.pop, .submit.ready, .rise, .pick-grid .cell, .pick-grid .cell-add { animation: none; }
  }
  .prompt-card { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; font-size: 1.12rem; line-height: 1.5; font-family: var(--serif); font-style: italic; color: var(--ink); }
  textarea, input[type="text"] {
    width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--field);
    color: var(--ink); font: inherit; font-size: 16px; padding: 13px 15px; outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  textarea { min-height: 150px; resize: vertical; font-family: var(--serif); }
  textarea::placeholder, input::placeholder { color: var(--ink-faint); }
  textarea:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
  .count { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
  .photo-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    border: 1px dashed var(--line-strong); border-radius: 12px; background: none; color: var(--ink-soft);
    font: inherit; font-size: 14px; padding: 20px; cursor: pointer;
  }
  .photo-wrap { position: relative; }
  .photo-wrap img { width: 100%; border-radius: 12px; display: block; }
  .photo-remove {
    position: absolute; top: 10px; right: 10px; border: 0; border-radius: 999px;
    background: rgba(0,0,0,0.65); color: #fff; font-size: 13px; font-weight: 600; padding: 6px 12px; cursor: pointer;
  }
  .submit {
    width: 100%; margin-top: 28px; border: 0; border-radius: 12px; background: var(--accent);
    color: var(--accent-ink); font-family: var(--sans); font-size: 1.05rem; font-weight: 700; padding: 16px; cursor: pointer;
  }
  .submit:disabled { opacity: 0.35; cursor: default; }
  .error { color: var(--danger); font-size: 14px; margin-top: 12px; }
  .spinner { text-align: center; color: var(--ink-soft); padding: 60px 0; }

<script>
const SUPABASE_URL = Nanafy.SUPABASE_URL;
const ANON_KEY = Nanafy.ANON_KEY;
const HEADERS = { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY };
const PREPOSITIONS = { memorial: 'In memory of', wedding: 'Celebrating', birthday: 'Celebrating', graduation: 'Congratulating', tribute: 'A tribute to', other: 'For' };

// Who the guest's name is for — the copy names the keepsake's reader, so a
// coach's tribute never says "so the family knows". Living celebrations read
// their own keepsake, so the honoree's name is the most specific answer;
// memorials name the family; 'other' keepsakes are occasions, not people.
function nameAudience() {
  switch (event.event_type) {
    case 'memorial': return 'the family';
    case 'wedding': return 'the couple';
    case 'other': return 'everyone';
    default: return (event.honoree || '').trim() || 'everyone';
  }
}
const TARGET_WORDS = 250;

const app = document.getElementById('app');
let event = null;
let promptIndex = 0;
let drafts = {};
let questionPhotos = {}; // File[] per question — photos stay with their question
let sentAnswers = {};    // answers that already landed, so a retry never duplicates
let savedName = '';

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

// Every screen rises in, the way the app's screens do.
function enter() { app.classList.remove('rise'); void app.offsetWidth; app.classList.add('rise'); }

// The two ways in: written memories, or a batch of photos (for the family
// member who takes a million of them and will not be writing paragraphs).
function laneTabs(active) {
  return '<div class="lane-tabs" role="tablist">' +
    '<button type="button" class="lane-tab" id="laneWords" aria-pressed="' + (active === 'words') + '">Answer a question</button>' +
    '<button type="button" class="lane-tab" id="lanePhotos" aria-pressed="' + (active === 'photos') + '">Just add photos</button>' +
    '</div>';
}
function wireLaneTabs(active) {
  document.getElementById('laneWords').addEventListener('click', () => { if (active !== 'words') renderForm(); });
  document.getElementById('lanePhotos').addEventListener('click', () => { if (active !== 'photos') renderPhotoForm(); });
}

// Shrink a photo in the browser before upload: phones produce 5-12MB
// originals, and a venue's wifi should not have to carry them. Returns a
// JPEG blob, or the original file when the browser can't decode it.
async function shrink(file, maxDim) {
  maxDim = maxDim || 2000;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
    bmp.close && bmp.close();
    const blob = await new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.85));
    return blob || file;
  } catch (e) { return file; }
}

async function uploadPhoto(file) {
  const blob = await shrink(file);
  const path = event.id + '/' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
  const up = await fetch(SUPABASE_URL + '/storage/v1/object/memory-photos/' + path, {
    method: 'POST',
    headers: { ...HEADERS, 'Content-Type': 'image/jpeg' },
    body: blob,
  });
  if (!up.ok) throw new Error('photo');
  return SUPABASE_URL + '/storage/v1/object/public/memory-photos/' + path;
}

let batchFiles = [];

function renderPhotoForm() {
  const prep = PREPOSITIONS[event.event_type] || 'For';
  const title = event.honoree || event.title;
  app.innerHTML =
    '<div class="center"><p class="prep">' + esc(prep) + '</p>' +
    '<h1 class="honoree">' + esc(title) + '</h1>' +
    '<p class="sub">Add your photos — pick as many as you like, straight from your camera roll.</p></div>' +
    laneTabs('photos') +
    '<span class="label">Your photos</span>' +
    '<div class="pick-grid" id="pickGrid"></div>' +
    '<input type="file" id="batchInput" accept="image/*" multiple hidden>' +
    '<span class="label">Say something about them (optional)</span>' +
    '<input type="text" id="batchNote" placeholder="From the ferry ride over…" maxlength="200">' +
    '<span class="label">Your name</span>' +
    '<input type="text" id="name" placeholder="Anonymous" autocomplete="name" value="' + esc(savedName) + '">' +
    '<button class="submit" id="batchSubmit" disabled>Send photos</button>' +
    '<div class="upl-progress" id="uplProgress" hidden></div>' +
    '<p class="error" id="err" hidden></p>';
  wireLaneTabs('photos');
  enter();

  const input = document.getElementById('batchInput');
  const grid = document.getElementById('pickGrid');
  const submit = document.getElementById('batchSubmit');

  function renderGrid() {
    grid.innerHTML = batchFiles.map((f, i) =>
      '<div class="cell"><img src="' + URL.createObjectURL(f) + '" alt="">' +
      '<button type="button" class="cell-x" data-i="' + i + '" aria-label="Remove photo">✕</button></div>'
    ).join('') + '<button type="button" class="cell-add" id="cellAdd" aria-label="Add photos">＋</button>';
    submit.disabled = batchFiles.length === 0;
    submit.textContent = batchFiles.length
      ? 'Send ' + batchFiles.length + ' photo' + (batchFiles.length > 1 ? 's' : '')
      : 'Send photos';
  }
  renderGrid();

  grid.addEventListener('click', (e) => {
    if (e.target.id === 'cellAdd') input.click();
    const x = e.target.closest('.cell-x');
    if (x) { batchFiles.splice(+x.dataset.i, 1); renderGrid(); }
  });
  input.addEventListener('change', () => {
    batchFiles = batchFiles.concat(Array.from(input.files || []));
    input.value = '';
    renderGrid();
  });

  submit.addEventListener('click', async () => {
    submit.disabled = true;
    const err = document.getElementById('err');
    const prog = document.getElementById('uplProgress');
    err.hidden = true; prog.hidden = false;
    const name = document.getElementById('name').value.trim() || null;
    const note = document.getElementById('batchNote').value.trim() || null;
    const total = batchFiles.length;
    let sent = 0;
    try {
      const h = await Nanafy.headers();
      for (let i = 0; i < batchFiles.length; i++) {
        prog.textContent = 'Sending photo ' + (i + 1) + ' of ' + total + '…';
        const photoUrl = await uploadPhoto(batchFiles[i]);
        const ins = await fetch(SUPABASE_URL + '/rest/v1/memories', {
          method: 'POST',
          headers: { ...h, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
          body: JSON.stringify({
            event_id: event.id,
            contributor_name: name,
            body: i === 0 ? note : null, // the batch note rides on the first photo
            photo_url: photoUrl,
          }),
        });
        if (!ins.ok) throw new Error('insert');
        sent++;
      }
      savedName = name || '';
      batchFiles = [];
      renderSuccess(total);
    } catch (e) {
      prog.hidden = true;
      err.textContent = sent > 0
        ? sent + ' of ' + total + ' photos made it — the rest didn’t send. Remove the first ' + sent + ' and try the rest again.'
        : 'The photos couldn’t be sent. Check your connection and try again.';
      err.hidden = false;
      submit.disabled = false;
    }
  });
}

async function fetchEvent(code) {
  // The share code is exchanged for membership through the join RPC — the
  // database no longer answers direct reads without it.
  return Nanafy.join(code, 'id,title,event_type,honoree,share_code,owner_id,prompts(text,position)');
}

function renderCodeEntry(message) {
  app.innerHTML =
    '<div class="center"><h1>Add your memory</h1>' +
    '<p class="sub">Enter the 6-character code you were given.</p></div>' +
    '<form class="code-form" id="codeForm">' +
    '<input type="text" id="codeInput" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABC123" aria-label="Event code">' +
    (message ? '<p class="error">' + esc(message) + '</p>' : '') +
    '<button class="submit" type="submit">Find it</button></form>';
  enter();
  document.getElementById('codeForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const code = document.getElementById('codeInput').value.trim();
    if (code.length === 6) start(code);
  });
}

function renderForm() {
  const prep = PREPOSITIONS[event.event_type] || 'For';
  const prompts = (event.prompts || []).sort((a, b) => a.position - b.position).map((p) => p.text);
  const title = event.honoree || event.title;
  const n = prompts.length;
  app.innerHTML =
    '<div class="center"><p class="prep">' + esc(prep) + '</p>' +
    '<h1 class="honoree">' + esc(title) + '</h1>' +
    '<p class="sub">Answer all ' + n + ' questions — it takes a few minutes and means more than you know.</p></div>' +

    laneTabs('words') +

    '<span class="label">First, your name</span>' +
    '<input type="text" id="name" placeholder="So ' + esc(nameAudience()) + ' will know who this is from" autocomplete="name" value="' + esc(savedName) + '">' +
    '<p class="error" id="nameErr" hidden>Add your name before answering — ' + esc(nameAudience()) + ' will want to know who this is from.</p>' +

    '<span class="label" id="progressLabel">Answer all ' + n + ' questions · 0 done</span>' +
    '<div class="prompts" id="promptNums">' +
    prompts.map((_, i) => '<button type="button" class="prompt-num' + (i === 0 ? ' sel' : '') + '" data-i="' + i + '">' + (i + 1) + '</button>').join('') +
    '</div>' +
    '<div class="qpane" id="qpane">' +
    '<div class="prompt-card" id="promptText">' + esc(prompts[0] || '') + '</div>' +

    '<span class="label">Your answer</span>' +
    '<textarea id="body" placeholder="Share your memory…"></textarea>' +
    '<div class="count" id="count">0 words · aim for around ' + TARGET_WORDS + '</div>' +

    '<span class="label">Add photos (optional)</span>' +
    '<div class="count" style="margin:-4px 0 8px">Photos stay with this question — add as many as you like.</div>' +
    '<div class="pick-grid" id="qPhotoGrid"></div>' +
    '</div>' +
    '<input type="file" id="qPhotoInput" accept="image/*" multiple hidden>' +

    '<div class="gate-hint" id="gateHint"></div>' +
    '<button class="submit" id="submit">Next question</button>' +
    '<p style="text-align:center;margin:18px 0 0;font-size:.85rem"><a style="color:var(--accent);font-weight:700;text-decoration:none" href="/keepsake/view/?c=' + encodeURIComponent(event.share_code || '') + '">Just here to look? See the keepsake &rarr;</a></p>' +
    '<div class="upl-progress" id="sendProgress" hidden></div>' +
    '<p class="error" id="err" hidden></p>';

  wireLaneTabs('words');
  enter();
  const bodyEl = document.getElementById('body');
  const submitEl = document.getElementById('submit');
  const photoInput = document.getElementById('qPhotoInput');
  const photoGrid = document.getElementById('qPhotoGrid');

  function answeredList() { return prompts.map((_, i) => !!(drafts[i] || '').trim()); }
  function answeredCount() { return answeredList().filter(Boolean).length; }
  function allAnswered() { return n > 0 && answeredCount() === n; }
  function nextUnanswered() {
    const a = answeredList();
    for (let step = 1; step <= n; step++) { const i = (promptIndex + step) % n; if (!a[i]) return i; }
    return promptIndex;
  }

  let wasAllAnswered = false;
  function refreshProgress() {
    const done = answeredCount();
    const a = answeredList();
    document.getElementById('progressLabel').textContent =
      'Answer all ' + n + ' questions · ' + done + ' done';
    document.querySelectorAll('.prompt-num').forEach((el) => {
      const i = +el.dataset.i;
      const wasDone = el.classList.contains('done');
      el.classList.toggle('sel', i === promptIndex);
      el.classList.toggle('done', a[i]);
      el.textContent = a[i] && i !== promptIndex ? '✓' : String(i + 1);
      // The little spring the app's haptic tick stands in for.
      if (a[i] && !wasDone) {
        el.classList.add('pop');
        el.addEventListener('animationend', () => el.classList.remove('pop'), { once: true });
      }
    });
    const hint = document.getElementById('gateHint');
    if (allAnswered()) {
      hint.textContent = '';
      submitEl.textContent = 'Share your memories';
      if (!wasAllAnswered) {
        submitEl.classList.add('ready');
        submitEl.addEventListener('animationend', () => submitEl.classList.remove('ready'), { once: true });
      }
      wasAllAnswered = true;
    } else {
      hint.textContent = done + ' of ' + n + ' answered — answer them all to share';
      submitEl.textContent = 'Next question';
      wasAllAnswered = false;
    }
  }

  function refreshCount() {
    const words = bodyEl.value.trim() ? bodyEl.value.trim().split(/\s+/).length : 0;
    document.getElementById('count').textContent = words + ' words · aim for around ' + TARGET_WORDS;
  }

  function renderQuestionPhotos() {
    const files = questionPhotos[promptIndex] || [];
    photoGrid.innerHTML = files.map((f, i) =>
      '<div class="cell"><img src="' + URL.createObjectURL(f) + '" alt="">' +
      '<button type="button" class="cell-x" data-i="' + i + '" aria-label="Remove photo">✕</button></div>'
    ).join('') + '<button type="button" class="cell-add" id="qCellAdd" aria-label="Add photos">＋</button>';
  }

  let swapping = false;
  function goToQuestion(i) {
    if (swapping || i === promptIndex) return;
    drafts[promptIndex] = bodyEl.value;
    promptIndex = i;
    // Fade the question pane down and back — the web stand-in for the app's
    // screen transition. Progress updates immediately; content swaps mid-fade.
    const pane = document.getElementById('qpane');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    refreshProgress();
    window.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' });
    function apply() {
      document.getElementById('promptText').textContent = prompts[promptIndex];
      bodyEl.value = drafts[promptIndex] || '';
      renderQuestionPhotos();
      refreshCount();
    }
    if (reduced) { apply(); return; }
    swapping = true;
    pane.classList.add('swap');
    setTimeout(() => {
      apply();
      pane.classList.remove('swap');
      swapping = false;
    }, 170);
  }

  bodyEl.value = drafts[promptIndex] || '';
  renderQuestionPhotos();
  refreshCount();
  refreshProgress();

  document.getElementById('promptNums').addEventListener('click', (e) => {
    const b = e.target.closest('.prompt-num'); if (!b) return;
    if (!requireName()) return; // no wandering the questions nameless either
    goToQuestion(+b.dataset.i);
  });

  bodyEl.addEventListener('input', () => { drafts[promptIndex] = bodyEl.value; refreshCount(); refreshProgress(); });

  photoGrid.addEventListener('click', (e) => {
    if (e.target.id === 'qCellAdd') photoInput.click();
    const x = e.target.closest('.cell-x');
    if (x) {
      (questionPhotos[promptIndex] || []).splice(+x.dataset.i, 1);
      renderQuestionPhotos();
    }
  });
  photoInput.addEventListener('change', () => {
    questionPhotos[promptIndex] = (questionPhotos[promptIndex] || []).concat(Array.from(photoInput.files || []));
    photoInput.value = '';
    renderQuestionPhotos();
  });

  const nameEl = document.getElementById('name');
  const nameErr = document.getElementById('nameErr');
  nameEl.addEventListener('input', () => { nameErr.hidden = true; nameEl.style.borderColor = ''; });
  function requireName() {
    if (nameEl.value.trim()) return true;
    nameErr.hidden = false;
    nameEl.style.borderColor = 'var(--danger)';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    nameEl.focus({ preventScroll: true });
    return false;
  }

  submitEl.addEventListener('click', async () => {
    drafts[promptIndex] = bodyEl.value;
    // The name is asked once, up front, and it is not optional — nobody
    // should reach question two anonymous by accident.
    if (!requireName()) return;
    if (!allAnswered()) { goToQuestion(nextUnanswered()); return; }

    submitEl.disabled = true;
    submitEl.textContent = 'Sharing…';
    const err = document.getElementById('err');
    const prog = document.getElementById('sendProgress');
    err.hidden = true; prog.hidden = false;
    const name = nameEl.value.trim();
    try {
      const h = await Nanafy.headers();
      for (let i = 0; i < n; i++) {
        if (sentAnswers[i]) continue; // landed on an earlier try — never duplicate
        prog.textContent = 'Sending answer ' + (i + 1) + ' of ' + n + '…';
        const files = questionPhotos[i] || [];
        const photoUrl = files[0] ? await uploadPhoto(files[0]) : null;
        const ins = await fetch(SUPABASE_URL + '/rest/v1/memories', {
          method: 'POST',
          headers: { ...h, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
          body: JSON.stringify({
            event_id: event.id,
            prompt_text: prompts[i],
            contributor_name: name,
            body: (drafts[i] || '').trim(),
            photo_url: photoUrl,
          }),
        });
        if (!ins.ok) throw new Error('insert');
        // The first photo rides on the answer; the rest follow as photo
        // memories, the same shape the photo lane produces.
        for (let p = 1; p < files.length; p++) {
          prog.textContent = 'Sending photo ' + p + ' of ' + (files.length - 1) + ' for answer ' + (i + 1) + '…';
          const extraUrl = await uploadPhoto(files[p]);
          const insP = await fetch(SUPABASE_URL + '/rest/v1/memories', {
            method: 'POST',
            headers: { ...h, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
            body: JSON.stringify({ event_id: event.id, contributor_name: name, body: null, photo_url: extraUrl }),
          });
          if (!insP.ok) throw new Error('insert');
        }
        sentAnswers[i] = true;
      }
      savedName = name || '';
      const answers = n;
      drafts = {}; questionPhotos = {}; sentAnswers = {}; promptIndex = 0;
      renderSuccess(0, answers);
    } catch (e) {
      prog.hidden = true;
      const landed = Object.keys(sentAnswers).length;
      err.textContent = landed > 0
        ? landed + ' of ' + n + ' answers made it — the rest didn’t send. Tap again to send just the rest.'
        : (e.message === 'photo'
          ? 'A photo couldn’t be uploaded. Remove it or try a smaller one, then share again.'
          : 'Something went wrong sending your answers. Check your connection and try again.');
      err.hidden = false;
      submitEl.disabled = false;
      submitEl.textContent = 'Share your memories';
    }
  });
}

function renderSuccess(photoCount, answerCount) {
  const title = event.honoree || event.title;
  const gentle = event.event_type === 'memorial' || event.event_type === 'tribute';
  const promoLine = gentle
    ? 'If you ever want to gather memories for someone you love, you can make a keepsake of your own.'
    : 'Want one of these for your own gathering? It takes about a minute.';
  const what = answerCount
    ? 'All ' + answerCount + ' of your answers have'
    : photoCount
      ? 'Your ' + (photoCount > 1 ? photoCount + ' photos have' : 'photo has')
      : 'Your memory has';
  // Owned keepsakes are moderated: the contribution waits for the host's approval.
  const sub = event.owner_id
    ? what + ' been sent to the host to review. Once they approve, it will be part of the keepsake for ' + esc(title) + '.'
    : what + ' been added to ' + esc(title) + '. It will be part of a keepsake worth holding onto.';
  app.innerHTML =
    '<div class="center"><div class="success-glyph"></div>' +
    '<h1>Thank you</h1>' +
    '<p class="sub">' + sub + '</p>' +
    '<a class="submit" style="display:block;text-decoration:none;text-align:center" href="/keepsake/view/?c=' + encodeURIComponent(event.share_code || '') + '">See the keepsake so far</a>' +
    '<button class="again" id="again">Share another memory</button>' +
    '<div class="promo">' +
    '<div class="promo-kicker">Nanafy is free for everyone</div>' +
    '<p class="promo-line">' + promoLine + '</p>' +
    '<a class="promo-btn" href="/create/?ref=guest">Create your own keepsake</a>' +
    '<p class="promo-fine">Free &#183; No app &#183; No sign-up for your guests</p>' +
    '</div></div>';
  enter();
  document.getElementById('again').addEventListener('click', () => {
    drafts = {}; questionPhotos = {}; sentAnswers = {}; promptIndex = 0;
    renderForm();
  });
  window.scrollTo(0, 0);
}

async function start(code) {
  app.innerHTML = '<div class="spinner">Finding it…</div>';
  try {
    event = await fetchEvent(code);
    if (!event) return renderCodeEntry("No keepsake found with code " + code.toUpperCase() + ". Double-check it and try again.");
    const u = new URL(location.href);
    u.searchParams.set('c', code.toUpperCase());
    history.replaceState(null, '', u);
    renderForm();
  } catch {
    renderCodeEntry("Couldn't reach the server. Check your connection and try again.");
  }
}

const initialCode = new URLSearchParams(location.search).get('c');
if (initialCode && initialCode.trim().length === 6) start(initialCode.trim());
else renderCodeEntry();
</script>
