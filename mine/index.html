<style>
  :root {
    --ground: #FBF4EE; --surface: #FFFBF6; --surface-2: #F5E8DE;
    --ink: #2C1D28; --ink-soft: #6A5460; --line: #E7D7CC;
    --plum: #8A3F5C; --turq: #0a786f; --turq-deep: #085d56; --turq-ink: #04302C; --turq-soft: #A9E3DE;
    --shadow: rgba(58, 30, 44, 0.13); --danger: #B23A3A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #1F1620; --surface: #2B1F2C; --surface-2: #362538;
      --ink: #F1E5DC; --ink-soft: #BFA9B2; --line: #3D2E3C;
      --plum: #D68CA7; --turq: #0a786f; --turq-deep: #23a99e; --turq-ink: #eafffb; --turq-soft: #2A5C58;
      --shadow: rgba(0, 0, 0, 0.4); --danger: #F0918C;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    --serif: "Hoefler Text", "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
    background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 26px 20px 72px; }
  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 26px; }
  .brand .mark { font-family: var(--serif); font-size: 1.35rem; font-weight: 600; color: var(--ink-soft); letter-spacing: -0.02em; }
  .brand .mark b { color: var(--turq); }
  .topnav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 26px; }
  .topnav .brand { margin-bottom: 0; text-decoration: none; }
  .tn-links { display: flex; gap: 7px; }
  .tn-links a { font-size: 0.85rem; font-weight: 600; color: var(--turq-deep); text-decoration: none; padding: 7px 12px; border: 1px solid var(--turq-soft); border-radius: 999px; white-space: nowrap; }
  .tn-links a:hover { background: var(--turq); color: var(--turq-ink); border-color: var(--turq); }
  @media (max-width: 430px) { .tn-links a { padding: 6px 9px; font-size: 0.78rem; } }

  h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(2rem, 6vw, 2.6rem); line-height: 1.08; margin: 0 0 6px; letter-spacing: -0.01em; }
  .lede { color: var(--ink-soft); font-size: 1rem; margin: 0 0 24px; }

  .create-btn {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
    background: var(--turq); color: var(--turq-ink); border-radius: 999px; padding: 13px 22px;
    font-weight: 700; font-size: 1rem; box-shadow: 0 8px 20px -8px rgba(10,120,111,0.5); margin-bottom: 28px;
  }

  .klist { display: grid; gap: 12px; }
  .kcard {
    display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px;
    box-shadow: 0 12px 30px -26px var(--shadow); transition: transform 0.12s cubic-bezier(.22,.9,.36,1), border-color 0.15s ease;
  }
  .kcard:hover { transform: translateY(-1px); border-color: var(--turq-soft); }
  .kcard .emoji { font-size: 1.7rem; flex: none; }
  .kcard .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .kcard .name { display: block; font-family: var(--serif); font-size: 1.2rem; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kcard .meta { display: block; font-size: 0.82rem; color: var(--ink-soft); margin-top: 2px; }
  .kcard .arrow { flex: none; color: var(--turq-deep); font-size: 1.2rem; }

  .empty { text-align: center; padding: 20px 10px 10px; }
  .empty .em { font-size: 2.8rem; }
  .empty h2 { font-family: var(--serif); font-weight: 600; font-size: 1.5rem; margin: 10px 0 8px; }
  .empty p { color: var(--ink-soft); margin: 0 auto 22px; max-width: 26em; }

  /* auth card */
  .auth-card { background: var(--surface-2); border-radius: 16px; padding: 18px; margin-top: 26px; }
  .auth-card .auth-title { font-weight: 700; font-size: 1rem; margin-bottom: 6px; }
  .auth-card .auth-sub { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 14px; line-height: 1.45; }
  .otp-form { display: flex; gap: 8px; flex-wrap: wrap; }
  .otp-form input { flex: 1; min-width: 200px; font: inherit; font-size: 1rem; padding: 12px 15px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); outline: none; }
  .otp-form input:focus { border-color: var(--turq); box-shadow: 0 0 0 3px var(--turq-soft); }
  .otp-btn { flex: none; border: 0; border-radius: 12px; padding: 0 20px; background: var(--turq); color: var(--turq-ink); font: inherit; font-weight: 700; font-size: 0.95rem; cursor: pointer; }
  .otp-btn:disabled { opacity: 0.5; cursor: default; }
  .auth-msg { font-size: 0.9rem; color: var(--turq-deep); margin: 12px 0 0; min-height: 1.1em; line-height: 1.4; }
  .auth-msg.err { color: var(--danger); }
  .auth-fine { font-size: 0.78rem; color: var(--ink-soft); margin: 12px 0 0; line-height: 1.45; }
  .auth-alt { border: 0; background: none; color: var(--turq-deep); font: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: underline; margin-top: 10px; padding: 0; }
  .auth-card.signed { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .auth-card.signed .who b { color: var(--ink); }
  .auth-card.signed .who .auth-sub { margin: 3px 0 0; }
  .link-btn { border: 0; background: none; color: var(--turq-deep); font: inherit; font-weight: 600; font-size: 0.9rem; cursor: pointer; text-decoration: underline; flex: none; }

  .note { margin-top: 22px; font-size: 0.82rem; color: var(--ink-soft); line-height: 1.5; text-align: center; }
  .foot { margin-top: 30px; text-align: center; font-size: 12.5px; color: var(--ink-soft); }
  .foot a { color: var(--turq-deep); text-decoration: none; }

    color-scheme:light;

    --ink:#14201f; --ink-soft:#5a6a68; --line:#ece6dd;
    --plum:#c14e7c; --turq:#0fb0a4; --turq-deep:#0a7a72; --turq-ink:#ffffff; --turq-soft:#bfeae6;
    --shadow:rgba(20,32,31,.14); --danger:#c0392b;
  }
  body{ --serif:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif; }
  h1,h2,.brand .mark,.code-chip b,.key-sub b,#honoree{ font-weight:900; letter-spacing:-.02em; }
  .submit,.copy-btn,.action.primary,.chip[aria-pressed="true"]{ box-shadow:0 10px 24px -10px rgba(15,176,164,.55); }

  /* == web↔app consistency: turquoise labels + turquoise-wash note (match app) == */
  .label{ color:var(--turq-deep); }
  .note{ background:#e7f7f5; }

  /* --- refinement: Miami-pink "fy", app flower, sharper editorial look --- */
  .brand .mark{ color:#f28ab0; }
  .brand .mark b{ color:#0FB0A4; }
  .btn,.submit,.copy-btn,.action,.nav-cta,.topnav-links a,.tn-links a,.g-copy,.nana,.addown,.suggestion,.chip,.mine-banner,input[type="text"],input[type="email"],.p-input,.code-form input,.link-box{ border-radius:8px !important; }
  .mcard,.step,.occ,.keep-visual,.note,.qr-card,.gather,.signup-ok{ border-radius:10px !important; }
  .mcard,.step,.occ,.keep-visual{ box-shadow:none !important; }
  h1,h2,.khead h1{ letter-spacing:-.04em !important; }

  /* --- Nike flow: plain header links --- */
  .tn-links a{ border:0 !important; border-radius:0 !important; padding:6px 2px !important; font-weight:700; color:var(--ink); }
  .tn-links a:hover{ background:none !important; color:var(--turq-deep) !important; box-shadow:inset 0 -2px 0 var(--turq); }

  /* --- Nike flow: keepsake list tiles --- */
  .klist{ display:grid; gap:12px; }
  .kcard{ position:relative; overflow:hidden; display:flex !important; flex-direction:column; justify-content:flex-end; align-items:flex-start; min-height:180px; border-radius:10px !important; padding:18px !important; text-decoration:none; border:0 !important; }
  .kcard .bloom-wm{ position:absolute; top:-42%; right:-16%; width:62%; pointer-events:none; }
  .kcard .kname{ color:#fff; font-weight:900; font-size:1.65rem; letter-spacing:-.02em; line-height:1.05; position:relative; }
  .kcard .kmeta{ color:rgba(255,255,255,.82); font-size:.85rem; position:relative; margin-top:5px; }

  /* --- desktop posture: fill the screen --- */
  .wrap{ max-width:1140px; }
  #list h1{ font-size:clamp(2.4rem,5vw,3.8rem); line-height:1; }
  .klist{ grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px; }
  @media(min-width:760px){ .kcard{ min-height:240px; } .kcard .kname{ font-size:1.9rem; } }

  /* --- header profile chip --- */
  .tn-links a.prof-chip, .prof-chip{ width:34px; height:34px; border-radius:999px !important; background:var(--turq); color:#fff !important; font-weight:800; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; font-size:.95rem; padding:0 !important; border:0 !important; }
  .prof-link{ font-weight:700; color:var(--ink); text-decoration:none; align-self:center; }

  /* --- password auth --- */

  /* --- thumb-sized hit areas on text links -------------------------------
     A 15px link is fine to read and hard to hit. These keep their size and
     their place in the sentence; only the area that responds to a tap grows,
     via a pseudo-element, so nothing reflows. */
  .foot a { position:relative; display:inline-block; }
  .foot a::after {
    content:""; position:absolute; left:-10px; right:-10px; top:50%;
    height:44px; transform:translateY(-50%);
  }

  /* --- thumb-sized header controls ----------------------------------------
     The shared header links measured 24-31px of reachable height. They now
     clear 44px without the labels changing size: the row grows, the type
     doesn't. */
  .topnav .brand, .tn-links a, .tn-links .prof-link { min-height:44px; display:inline-flex; align-items:center; }
  /* --- the sign-in card, rebuilt 2026-08-19 -------------------------------
     Was: two placeholder-only fields, two competing buttons, and the magic
     link as a 21px underlined sentence. Now: one visible mode at a time,
     labels that stay put, and every control at a real tap size. --- */
  /* On a wide screen a full-width password field looks wrong — the card is a
     form, not a section. Cap and centre it above phone widths. */
  @media (min-width:560px){ .auth-card{ max-width:460px; margin-left:auto; margin-right:auto; } }
  .auth-tabs{ display:flex; gap:8px; margin:0 0 18px; }
  .auth-tab{
    flex:1; min-height:46px; border:1px solid var(--line-strong); border-radius:12px; background:none;
    color:var(--ink-soft); font:inherit; font-weight:700; font-size:.95rem; cursor:pointer;
    transition:border-color .15s ease, background .15s ease, color .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .auth-tab[aria-selected="true"]{ border-color:var(--turq); color:var(--turq); background:var(--turq-soft); }
  .auth-tab:active{ transform:scale(.965); }

  .field{ margin:0 0 14px; }
  .field-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 0 7px; }
  .field-label{
    font-family:var(--display,inherit); font-size:.72rem; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:var(--turq); display:block;
  }
  .field-input{
    width:100%; font:inherit; font-size:16px; /* 16px stops iOS zooming on focus */
    background:var(--surface-2); color:var(--ink); border:1px solid var(--line);
    border-radius:12px; padding:14px 15px; outline:none; min-height:50px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field-input::placeholder{ color:var(--ink-soft); opacity:.65; }
  .field-input:focus{ border-color:var(--turq); box-shadow:0 0 0 3px var(--turq-soft); }
  .field-input[aria-invalid="true"]{ border-color:var(--danger); }
  .pw-wrap{ position:relative; }
  .pw-wrap .field-input{ padding-right:58px; }
  .pw-eye{
    position:absolute; top:0; right:0; height:100%; width:52px; display:flex; align-items:center; justify-content:center;
    border:0; background:none; color:var(--ink-soft); cursor:pointer; border-radius:12px;
  }
  .pw-eye:hover{ color:var(--turq); }
  .field-hint{ font-size:.8rem; color:var(--ink-soft); margin:7px 0 0; line-height:1.4; }
  .forgot{
    border:0; background:none; padding:4px 0; color:var(--turq); font:inherit; font-size:.8rem;
    font-weight:700; cursor:pointer; text-decoration:none; white-space:nowrap;
  }
  .forgot:hover{ text-decoration:underline; }
  /* Small text, thumb-sized target: the hit area is stretched to 44px with a
     pseudo-element so the label row's height doesn't change. */
  .forgot{ position:relative; }
  .forgot::after{ content:""; position:absolute; left:-10px; right:-10px; top:50%; height:44px; transform:translateY(-50%); }

  .auth-primary{
    width:100%; min-height:52px; border:0; border-radius:12px; background:var(--turq); color:var(--turq-ink);
    font:inherit; font-weight:700; font-size:1.02rem; cursor:pointer; margin-top:4px;
    transition:opacity .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .auth-primary:active:not(:disabled){ transform:scale(.965); }
  .auth-primary:disabled{ opacity:.55; cursor:default; }
  .auth-or{
    display:flex; align-items:center; gap:12px; margin:16px 0 12px;
    font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft);
  }
  .auth-or::before, .auth-or::after{ content:""; flex:1; height:1px; background:var(--line); }
  .auth-secondary{
    width:100%; min-height:50px; border:1px solid var(--line-strong); border-radius:12px; background:none;
    color:var(--ink); font:inherit; font-weight:700; font-size:.95rem; cursor:pointer;
    transition:border-color .15s ease, color .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .auth-secondary:hover{ border-color:var(--turq); color:var(--turq); }
  .auth-secondary:active:not(:disabled){ transform:scale(.965); }
  .auth-secondary:disabled{ opacity:.55; cursor:default; }
  @media (prefers-reduced-motion: reduce){
    .auth-tab, .auth-primary, .auth-secondary { transition:none; }
    .auth-tab:active, .auth-primary:active, .auth-secondary:active { transform:none; }
  }

  .pw-form{ display:grid; gap:10px; }
  .pw-form input{ width:100%; font:inherit; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:12px 14px; outline:none; }
  .pw-form input:focus{ border-color:var(--turq); box-shadow:0 0 0 3px var(--turq-soft); }
  .pw-row{ display:flex; gap:10px; }
  .pw-row .otp-btn{ flex:1; }
  .otp-btn.ghost{ background:none; border:1.5px solid var(--line); color:var(--turq-deep); }
  .otp-btn.ghost:hover{ border-color:var(--turq); }

  /* ═══ BLACK-ACCENT cards: deep color objects on the white canvas ═══ */
  .lede b{ color:var(--turq-deep); }

  .create-btn{ background:linear-gradient(135deg,#13c4b6,#0a877d); color:#fff;
    box-shadow:0 14px 34px -14px rgba(15,176,164,.7), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .18s cubic-bezier(.22,.9,.36,1), box-shadow .25s ease; }
  .create-btn:hover{ transform:translateY(-2px); box-shadow:0 18px 40px -14px rgba(15,176,164,.85), inset 0 1px 0 rgba(255,255,255,.35); }

  /* keepsake cards: deep gradient fields with light that reacts to you */
  .klist{ gap:16px; }
  .kcard{ min-height:210px; border-radius:14px !important; padding:20px !important;
    justify-content:space-between !important; isolation:isolate; will-change:transform;
    animation:rise .65s cubic-bezier(.22,.9,.36,1) backwards;
    transition:transform .3s cubic-bezier(.22,.9,.36,1), box-shadow .35s ease;
    box-shadow:0 26px 54px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.16), inset 0 0 0 1px rgba(255,255,255,.05); }
  .kcard:hover{ transform:translateY(-5px);
    box-shadow:0 38px 74px -28px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.22),
      inset 0 0 0 1px rgba(255,255,255,.08), 0 0 46px -16px var(--kglow, rgba(18,201,187,.45)); }
  @keyframes rise{ from{ opacity:0; transform:translateY(26px); } }
  /* cursor spotlight — the "reflection" */
  .kcard::before{ content:""; position:absolute; inset:0; z-index:1; opacity:0; transition:opacity .35s ease; pointer-events:none;
    background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.16), transparent 55%); }
  .kcard:hover::before{ opacity:1; }
  /* sheen sweep across the surface */
  .kcard::after{ content:""; position:absolute; top:-60%; left:-60%; width:55%; height:220%; z-index:1;
    transform:rotate(22deg) translateX(-260%); pointer-events:none; transition: transform .9s cubic-bezier(.22,.9,.36,1);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.09) 45%,rgba(255,255,255,.2) 50%,rgba(255,255,255,.09) 55%,transparent); }
  .kcard:hover::after{ transform:rotate(22deg) translateX(430%); }

  .kcard .bloom-wm{ opacity:.6; }
  .kcard .bloom-wm.w1{ top:auto; bottom:-38%; right:-14%; width:56%; transform:rotate(18deg); }
  .kcard .bloom-wm.w2{ top:-30%; right:auto; left:-18%; width:52%; transform:rotate(-14deg); }
  .kcard .bloom-wm.w3{ top:auto; bottom:-45%; right:26%; width:70%; transform:rotate(8deg); }

  .kcard .ktop{ position:relative; z-index:2; display:flex; justify-content:space-between; align-items:center; width:100%; gap:8px; }
  .kcard .ktag{ font-size:.66rem; font-weight:800; letter-spacing:.15em; text-transform:uppercase; color:rgba(255,255,255,.88);
    background:rgba(2,8,10,.32); border:1px solid rgba(255,255,255,.22); backdrop-filter:blur(8px); padding:5px 11px; border-radius:999px; }
  .kcard .kcount{ display:none; align-items:baseline; gap:5px; font-size:.74rem; font-weight:700; color:rgba(255,255,255,.92);
    background:rgba(2,8,10,.32); border:1px solid rgba(255,255,255,.18); backdrop-filter:blur(8px); padding:5px 11px; border-radius:999px; }
  .kcard .kcount b{ font-size:.95rem; font-weight:900; }
  .kcard .kbot{ position:relative; z-index:2; display:block; }
  .kcard .kname{ display:block; font-size:1.8rem; text-shadow:0 2px 22px rgba(0,0,0,.5); }
  .kcard .kmeta{ display:block; margin-top:3px; color:rgba(255,255,255,.66); }
  .kcard .kcode{ position:absolute; right:14px; bottom:12px; z-index:2; font-size:.64rem; font-weight:700; letter-spacing:.12em;
    color:rgba(255,255,255,.34); transition:color .25s ease; }
  .kcard:hover .kcode{ color:rgba(255,255,255,.75); }
  @media(min-width:760px){ .kcard{ min-height:250px; } .kcard .kname{ font-size:2.1rem; } }

  @media(prefers-reduced-motion:reduce){
    .kcard{ animation:none; transition:none; }
    .kcard::after{ display:none; }
  }

  /* == PEACOCK: match the app's 2026-08 redesign (final override layer).
     Deep teal ground, white ink, hairline borders; Josefin Sans announces,
     Lato does the work. The occasion-gradient keepsake tiles stay — they are
     dark color objects and sit naturally on the deep ground. == */
  :root{
    color-scheme:dark;
    --ground:#115E67; --surface:#0E5259; --surface-2:#0C4A51;
    --ink:#FFFFFF; --ink-soft:rgba(255,255,255,.70); --line:rgba(255,255,255,.22);
    --plum:#5FE0D2; --turq:#5FE0D2; --turq-deep:#5FE0D2; --turq-ink:#073B36; --turq-soft:rgba(95,224,210,.28);
    --shadow:transparent; --danger:#FFB4A6;
    --line-strong:rgba(255,255,255,.34);
  }
  body{
    --display:"Josefin Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --serif:"Lora",Georgia,serif;
    --sans:"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    font-family:var(--sans);
  }
  h1,h2{ font-family:var(--display) !important; font-weight:300 !important; letter-spacing:.02em !important; }
  .brand .mark{ font-family:var(--display); font-weight:600; letter-spacing:.18em; text-transform:uppercase; font-size:1.15rem; color:#EFA8BE; }
  .brand .mark b{ color:#fff; font-weight:600; }
  .brand svg [fill="#0FB0A4"]{ fill:#FFFFFF; }
  .brand svg [fill="#FFFFFF"]{ fill:var(--ground); }
  .tn-links a{ color:var(--ink); }
  .tn-links a:hover{ color:var(--turq) !important; box-shadow:inset 0 -2px 0 var(--turq); }
  .prof-chip{ background:var(--turq); color:var(--turq-ink) !important; }
  .prof-link{ color:var(--ink); }
  .lede b{ color:var(--turq); }
  .create-btn{ background:var(--turq); color:var(--turq-ink); box-shadow:none; border-radius:12px; }
  .create-btn:hover{ transform:translateY(-1px); box-shadow:none; }
  .kcard{ box-shadow:inset 0 1px 0 rgba(255,255,255,.16), inset 0 0 0 1px rgba(255,255,255,.08); }
  .kcard:hover{ box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 0 1px rgba(255,255,255,.12),
    0 0 46px -16px var(--kglow, rgba(95,224,210,.45)); }
  .kcard .kname{ font-family:var(--display); font-weight:600; letter-spacing:.01em; }
  .empty h2{ color:var(--ink); }
  .empty p{ color:var(--ink-soft); }
  .auth-card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; }
  .auth-title{ color:var(--ink); }
  .otp-form input,.pw-form input{ background:var(--surface-2); color:var(--ink); border-color:var(--line); border-radius:12px !important; }
  input::placeholder{ color:rgba(255,255,255,.45); }
  .otp-btn{ background:var(--turq); color:var(--turq-ink); border-radius:12px; }
  .otp-btn.ghost{ background:none; border:1px solid var(--line-strong); color:var(--turq); }
  .otp-btn.ghost:hover{ border-color:var(--turq); }
  .auth-msg{ color:var(--turq); }
  .auth-msg.err{ color:var(--danger); }
  .auth-alt,.link-btn,.foot a{ color:var(--turq); }
  .note{ background:none; color:var(--ink-soft); }

  /* --- page transitions -----------------------------------------------------
     Cross-document view transitions: moving between the keepsake, the mosaic
     and the book cross-fades instead of blinking white. The tab bar and the
     site header are named, so they stay put while the content underneath
     changes — which is the whole difference between "an app with tabs" and
     "four web pages". Browsers without support simply navigate as before. */
  @view-transition { navigation: auto; }
  .tabbar { view-transition-name: nanafy-tabbar; }
  .topnav, .topbar, .bar { view-transition-name: nanafy-header; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .22s; }
  @media (prefers-reduced-motion: reduce) {
    ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
  }
</style>

  var META = {

  function fmtDate(ms){ try { return new Date(ms).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); } catch(e){ return ''; } }

  // ---- device list (Layer 1) ----
  function getDeviceList(){ try { return JSON.parse(localStorage.getItem('nanafy_keepsakes')||'[]'); } catch(e){ return []; } }
  function saveDeviceList(list){ try { localStorage.setItem('nanafy_keepsakes', JSON.stringify(list)); } catch(e){} }
  function mergeInto(list, items){
    items.forEach(function(it){ if(!list.some(function(x){return x.code===it.code;})) list.unshift(it); });

  var sb = window.supabase.createClient(SUPABASE_URL, ANON_KEY, {

  function renderList(){
    var list = getDeviceList().slice().sort(function(a,b){ return (b.created||0)-(a.created||0); });
    var el = document.getElementById('list');
    if (!list.length) {
      el.innerHTML =
        '<div class="empty">' +

        '<p>Keepsakes you create show up here. Sign in below to keep them safe and reach them from any device.</p>' +
        '<a class="create-btn" href="/create/">＋ Create a keepsake</a></div>';
      return;
    }
    el.innerHTML =
      '<h1>My keepsakes</h1>' +
      '<p class="lede" id="ledeLine">' + list.length + ' keepsake' + (list.length>1?'s':'') + '.</p>' +
      '<a class="create-btn" href="/create/">＋ Create a keepsake</a>' +
      '<div class="klist">' + list.map(function (k, i) {
        var m = META[k.type] || META.other;
        return '<a class="kcard" data-code="' + esc(k.code) + '" href="/keepsake/?c=' + encodeURIComponent(k.code) + '"' +
          ' style="' + fieldStyle(k.type, i) + ';animation-delay:' + Math.min(i * 70, 560) + 'ms">' +
          '<span class="bloom-wm w' + (i % 4) + '">' + BLOOM_WM + '</span>' +

          '<span class="kbot"><span class="kname">' + esc(k.name || 'Keepsake') + '</span>' +
          '<span class="kmeta">' + esc(fmtDate(k.created)) + '</span></span>' +
          '<span class="kcode">' + esc(k.code) + '</span></a>';
      }).join('') + '</div>';
    loadTileExtras(list.map(function(k){ return k.code; }));
  }

  // Honoree photos as tile backgrounds + live memory counts per keepsake.
  async function loadTileExtras(codes){
    if (!codes.length) return;
    // Reads are membership-scoped now: exchange each saved code through the
    // join RPC first (idempotent — repeat joins are no-ops). A join that
    // succeeds but returns nothing means the keepsake was deleted, which is
    // also our ghost-prune signal; a thrown join (network/server) proves
    // nothing, so it never prunes.
    var live = {};
    var certain = {};
    await Promise.all(codes.map(async function(c){
      try {
        var ev = await window.Nanafy.join(c, 'share_code,photo_url,memories(status)');
        if (ev && Array.isArray(ev.memories)) {
          // Count approved only — owners can also read their pending/rejected queue.
          ev.memories = [{ count: ev.memories.filter(function(m){ return m.status === 'approved'; }).length }];
        }
        certain[c.toUpperCase()] = true;
        if (ev) live[(ev.share_code || c).toUpperCase()] = ev;
      } catch (e) { /* unreachable — leave this code alone */ }
    }));
    var kept = getDeviceList().filter(function(k){
      var u = (k.code || '').toUpperCase();
      return live[u] || !certain[u];
    });
    if (kept.length !== getDeviceList().length) {
      saveDeviceList(kept);
      renderList();
      return;
    }
    var res = { data: Object.keys(live).map(function(u){ return live[u]; }) };
    (function(){
        // Count approved memories only — a signed-in owner can also see their
        // pending/rejected queue, which shouldn't inflate the keepsake counts.
        var total = 0;
        (res.data || []).forEach(function(row){
          var el = document.querySelector('.kcard[data-code="' + row.share_code + '"]');
          if (!el) return;
          var n = 0;
          if (Array.isArray(row.memories) && row.memories.length) n = row.memories[0].count || 0;
          total += n;
          if (n > 0) {
            var badge = el.querySelector('.kcount');
            badge.innerHTML = '<b>' + n + '</b> ' + (n === 1 ? 'memory' : 'memories');
            badge.style.display = 'inline-flex';
          }
          if (row.photo_url) {
            el.style.background =
              'linear-gradient(180deg, rgba(4,9,11,.1) 25%, rgba(4,9,11,.82) 85%), url(' + row.photo_url + ') center/cover';
            var wm = el.querySelector('.bloom-wm');
            if (wm) wm.style.display = 'none';
          }
        });
        if (total > 0) {
          var lede = document.getElementById('ledeLine');
          if (lede) lede.innerHTML = codes.length + ' keepsake' + (codes.length > 1 ? 's' : '') +
            ' · <b>' + total + '</b> ' + (total === 1 ? 'memory' : 'memories') + ' kept';
        }
    })();
  }

  // The reflection: a light spot + gentle 3D tilt that follows the cursor.
  (function(){
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    var listEl = document.getElementById('list');
    listEl.addEventListener('pointermove', function(e){
      var card = e.target.closest('.kcard'); if (!card) return;
      var r = card.getBoundingClientRect();
      var x = e.clientX - r.left, y = e.clientY - r.top;
      card.style.setProperty('--mx', x + 'px');
      card.style.setProperty('--my', y + 'px');
      var rx = ((y / r.height) - 0.5) * -5, ry = ((x / r.width) - 0.5) * 6;
      card.style.transform = 'translateY(-5px) perspective(900px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
    });
    listEl.addEventListener('pointerout', function(e){
      var card = e.target.closest('.kcard'); if (card) card.style.transform = '';
    });
  })();

  var EYE_OPEN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M1.5 12S5 5.5 12 5.5 22.5 12 22.5 12 19 18.5 12 18.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>';
  var EYE_SHUT = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M1.5 12S5 5.5 12 5.5c1.7 0 3.2.4 4.5 1M22.5 12S19 18.5 12 18.5c-1.7 0-3.2-.4-4.5-1"/>' +
    '<path d="M9.9 9.9a3.2 3.2 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>';

  function renderAuth(session){
    var el = document.getElementById('authArea');
    
    if (session && session.user) {
      el.innerHTML =
        '<div class="auth-card signed"><div class="who">✓ Signed in as <b>' + esc(session.user.email) + '</b>' +
        '<div class="auth-sub">Your keepsakes are saved to your account and follow you to any device.</div></div>' +
        '<button class="link-btn" id="signOut">Sign out</button></div>';
      document.getElementById('signOut').addEventListener('click', function(){
        sb.auth.signOut().then(function(){ location.reload(); });
      });
    } else {
      var savedEmail = '';
      try { savedEmail = localStorage.getItem('nanafy_signin_email') || ''; } catch (e) {}

      // One mode on screen at a time. Two equally-weighted buttons made you
      // choose before you knew which you were — a tab says which you're in.
      var mode = savedEmail ? 'signin' : 'signup';

      function draw() {
        var isNew = mode === 'signup';
        // A redraw must not eat what they already typed.
        var liveEmail = document.getElementById('pwEmail');
        if (liveEmail) savedEmail = liveEmail.value;
        var carryPass = (document.getElementById('pwPass') || {}).value || '';
        el.innerHTML =
          '<div class="auth-card">' +
          '<div class="auth-title">Keep your keepsakes</div>' +
          '<p class="auth-sub">Optional \u2014 but your keepsakes then follow you to any phone or computer. Guests never need an account.</p>' +

          '<div class="auth-tabs" role="tablist">' +
            '<button type="button" class="auth-tab" role="tab" id="tabSignIn" aria-selected="' + (!isNew) + '">Sign in</button>' +
            '<button type="button" class="auth-tab" role="tab" id="tabSignUp" aria-selected="' + isNew + '">Create account</button>' +
          '</div>' +

          '<form class="pw-form" id="pwForm" novalidate>' +
            '<div class="field">' +
              '<div class="field-head"><label class="field-label" for="pwEmail">Email</label></div>' +
              '<input class="field-input" type="email" id="pwEmail" name="email" placeholder="you@example.com" ' +
                'autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" ' +
                'value="' + esc(savedEmail) + '">' +
            '</div>' +

            '<div class="field">' +
              '<div class="field-head">' +
                '<label class="field-label" for="pwPass">Password</label>' +
                (isNew ? '' : '<button type="button" class="forgot" id="forgotPw">Forgot it?</button>') +
              '</div>' +
              '<div class="pw-wrap">' +
                '<input class="field-input" type="password" id="pwPass" name="password" ' +
                  'placeholder="' + (isNew ? 'Choose a password' : 'Your password') + '" ' +
                  'autocomplete="' + (isNew ? 'new-password' : 'current-password') + '">' +
                '<button type="button" class="pw-eye" id="pwEye" aria-label="Show password" aria-pressed="false">' + EYE_OPEN + '</button>' +
              '</div>' +
              (isNew ? '<p class="field-hint">At least 6 characters.</p>' : '') +
            '</div>' +

            '<button class="auth-primary" type="submit" id="authGo">' + (isNew ? 'Create account' : 'Sign in') + '</button>' +
          '</form>' +

          '<div class="auth-or">or</div>' +
          '<button type="button" class="auth-secondary" id="magicInstead">Email me a sign-in link instead</button>' +

          '<p class="auth-msg" id="authMsg" role="status" aria-live="polite"></p>' +
          '</div>';

        if (carryPass) document.getElementById('pwPass').value = carryPass;
        wire();
      }

      function say(text, isErr) {
        var m = document.getElementById('authMsg');
        m.className = 'auth-msg' + (isErr ? ' err' : '');
        m.textContent = text || '';
      }
      function busy(on, label) {
        var go = document.getElementById('authGo');
        var alt = document.getElementById('magicInstead');
        if (go) { go.disabled = on; if (label) go.textContent = label; }
        if (alt) alt.disabled = on;
      }
      function markInvalid(id) {
        var f = document.getElementById(id);
        if (!f) return;
        f.setAttribute('aria-invalid', 'true');
        f.focus();
      }
      function clearInvalid() {
        ['pwEmail', 'pwPass'].forEach(function (id) {
          var f = document.getElementById(id); if (f) f.removeAttribute('aria-invalid');
        });
      }

      function creds() {
        clearInvalid();
        var email = document.getElementById('pwEmail').value.trim();
        var pass = document.getElementById('pwPass').value;
        if (!email || email.indexOf('@') < 1 || email.indexOf('.') < 0) {
          say('That email doesn\u2019t look right \u2014 check it and try again.', true); markInvalid('pwEmail'); return null;
        }
        if (!pass || pass.length < 6) {
          say('Passwords need at least 6 characters.', true); markInvalid('pwPass'); return null;
        }
        try { localStorage.setItem('nanafy_signin_email', email); } catch (e) {}
        return { email: email, password: pass };
      }

      function wire() {
        document.getElementById('tabSignIn').addEventListener('click', function () {
          if (mode === 'signin') return; mode = 'signin'; draw();
        });
        document.getElementById('tabSignUp').addEventListener('click', function () {
          if (mode === 'signup') return; mode = 'signup'; draw();
        });

        // Show/hide the password — the commonest reason a correct password
        // gets typed wrong on a phone keyboard.
        var eye = document.getElementById('pwEye');
        eye.addEventListener('click', function () {
          var f = document.getElementById('pwPass');
          var show = f.type === 'password';
          f.type = show ? 'text' : 'password';
          eye.setAttribute('aria-pressed', String(show));
          eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
          eye.innerHTML = show ? EYE_SHUT : EYE_OPEN;
          f.focus();
        });

        ['pwEmail', 'pwPass'].forEach(function (id) {
          document.getElementById(id).addEventListener('input', function () {
            this.removeAttribute('aria-invalid'); say('');
          });
        });

        document.getElementById('pwForm').addEventListener('submit', function (e) {
          e.preventDefault();
          var c = creds(); if (!c) return;
          if (mode === 'signup') { doSignUp(c); } else { doSignIn(c); }
        });

        var forgot = document.getElementById('forgotPw');
        if (forgot) forgot.addEventListener('click', function () {
          var email = document.getElementById('pwEmail').value.trim();
          if (!email || email.indexOf('@') < 1) {
            say('Type your email above first, then tap this again.', true); markInvalid('pwEmail'); return;
          }
          say('Sending a reset link\u2026'); busy(true);
          sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/mine/#account' })
            .then(function (res) {
              if (res.error) throw res.error;
              say('Check ' + email + ' \u2014 including spam \u2014 for a link to set a new password.');
            })
            .catch(function (err) { say('Couldn\u2019t send it: ' + ((err && err.message) || 'try again in a minute.'), true); })
            .then(function () { busy(false); });
        });

        document.getElementById('magicInstead').addEventListener('click', function () {
          clearInvalid();
          var email = document.getElementById('pwEmail').value.trim();
          if (!email || email.indexOf('@') < 1) {
            say('Type your email above first, then tap this again.', true); markInvalid('pwEmail'); return;
          }
          try { localStorage.setItem('nanafy_signin_email', email); } catch (e) {}
          say('Sending your link\u2026'); busy(true);
          sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: location.origin + '/mine/' } })
            .then(function (res) {
              if (res.error) throw res.error;
              say('Check your email (' + email + ') \u2014 including spam \u2014 for a one-tap sign-in link from Nanafy.');
            })
            .catch(function (err) { say('Couldn\u2019t send the link: ' + ((err && err.message) || 'try again in a minute.'), true); })
            .then(function () { busy(false); });
        });

        // Land the cursor where the work is, without yanking the page on load.
        var first = document.getElementById(savedEmail ? 'pwPass' : 'pwEmail');
        if (first && location.hash === '#account') first.focus({ preventScroll: true });
      }

      function doSignIn(c) {
        say('Signing in\u2026'); busy(true, 'Signing in\u2026');
        sb.auth.signInWithPassword(c).then(function (res) {
          if (res.error) throw res.error;
          location.reload();
        }).catch(function (err) {
          var m = (err && err.message) || '';
          busy(false, 'Sign in');
          if (m.indexOf('Invalid login credentials') >= 0) {
            say('Wrong email or password. New here? Tap Create account.', true);
            markInvalid('pwPass');
          } else {
            say('Couldn\u2019t sign in: ' + (m || 'please try again.'), true);
          }
        });
      }

      function doSignUp(c) {
        say('Creating your account\u2026'); busy(true, 'Creating\u2026');
        sb.auth.signUp(c).then(function (res) {
          if (res.error) throw res.error;
          if (res.data && res.data.session) { location.reload(); return; }
          busy(false, 'Create account');
          say('Almost there \u2014 check your email to confirm your account, then sign in here.');
        }).catch(function (err) {
          var m = (err && err.message) || '';
          busy(false, 'Create account');
          if (m.indexOf('already registered') >= 0) {
            mode = 'signin'; draw(); // drop them straight into the right form
            say('That email already has an account \u2014 enter your password.', true);
          } else {
            say('Couldn\u2019t create the account: ' + (m || 'please try again.'), true);
          }
        });
      }

      draw();
    }
  }

  // ---- sync device keepsakes to the account + pull the account's keepsakes ----
  async function syncAndLoad(session){
    var uid = session.user.id;
    try {
      var device = getDeviceList();
      var codes = device.map(function(k){ return (k.code||'').toUpperCase(); }).filter(Boolean);

      // Record account membership for each device code. The join RPC is the
      // only path that can see an event from just its code now, and it writes
      // the membership row itself (idempotent).
      if (codes.length) {
        await Promise.all(codes.map(function(c){
          return sb.rpc('join_event_by_code', { p_code: c });
        }));
      }

      // Pull every keepsake tied to this account (from any device).
      var mem = await sb.from('event_members').select('event_id').eq('user_id', uid);
      var ids = (mem.data || []).map(function(m){ return m.event_id; });
      if (ids.length) {
        var evs = await sb.from('events').select('share_code,honoree,title,event_type,created_at').in('id', ids);
        var accountItems = (evs.data || []).map(function(e){
          return { code: e.share_code, name: e.honoree || e.title || 'Keepsake', type: e.event_type, created: Date.parse(e.created_at) };
        });
        saveDeviceList(mergeInto(getDeviceList(), accountItems));
        renderList();
      }
    } catch (e) { /* keep showing device list on any error */ }
  }

  // ---- boot ----
  renderList();
  sb.auth.getSession().then(function(res){
    var session = res.data.session;
    renderAuth(session);
    if (session) syncAndLoad(session);
  });
  sb.auth.onAuthStateChange(function(event, session){
    renderAuth(session);
    if (event === 'SIGNED_IN' && session) syncAndLoad(session);
  });
</script>
<script>
  // Header profile chip: shows your initial when signed in (reads the
  // session Supabase stores locally), otherwise a Sign in link.
  (function(){
    var el = document.getElementById('navProfile'); if (!el) return;
    var email = '';
    try {
      var raw = localStorage.getItem('sb-vigenqlwwoknxjzahvtv-auth-token');
      if (raw) { var s = JSON.parse(raw); email = (s.user && s.user.email) || (s.currentSession && s.currentSession.user && s.currentSession.user.email) || ''; }
    } catch (e) {}
    el.innerHTML = email
      ? '<a class="prof-chip" href="/mine/#account" title="' + email.replace(/"/g,'') + '">' + email[0].toUpperCase() + '</a>'
      : '<a class="prof-link" href="/mine/#account">Sign in</a>';
  })();
</script>
