<style>
  /*
   * The page a printed QR code opens.
   *
   * Someone is holding a book, has scanned a small square beside one memory,
   * and wants to hear that one person. So: their question, their name, a play
   * button big enough to hit without looking, and a way through to the rest.
   * Nothing else — this is not the keepsake, it is one page of it.
   */
  :root{
    color-scheme:dark;
    --ground:#115E67; --surface:#0E5259; --surface-2:#0C4A51;
    --ink:#FFFFFF; --ink-soft:rgba(255,255,255,.70); --ink-faint:rgba(255,255,255,.45);
    --line:rgba(255,255,255,.22); --line-strong:rgba(255,255,255,.34);
    --turq:#5FE0D2; --turq-ink:#073B36; --pink:#EFA8BE;
    --display:"Josefin Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --serif:"Lora",Georgia,serif;
    --sans:"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
    font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:520px; margin:0 auto; padding:34px 22px 60px; min-height:100svh;
    display:flex; flex-direction:column; }
  .brand{ display:flex; align-items:center; justify-content:center; gap:10px; margin:0 0 34px; }
  .brand .mark{ font-family:var(--display); font-size:1.1rem; font-weight:600;
    color:var(--pink); letter-spacing:.18em; text-transform:uppercase; }
  .brand .mark b{ color:var(--ink); font-weight:600; }
  main{ flex:1; display:flex; flex-direction:column; justify-content:center; }

  .q{ font-family:var(--display); font-size:.72rem; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:var(--turq); margin:0 0 14px; text-align:center; }
  .said{ font-family:var(--serif); font-style:italic; font-size:1.12rem; line-height:1.6;
    margin:0 0 22px; text-align:center; }
  .who{ font-family:var(--display); font-size:.78rem; font-weight:600; letter-spacing:.18em;
    text-transform:uppercase; color:var(--pink); text-align:center; margin:0 0 30px; }

  .player{ display:flex; align-items:center; gap:16px; border:1px solid var(--line);
    border-radius:16px; background:var(--surface-2); padding:16px 18px; }
  .play{ flex:none; width:64px; height:64px; border-radius:999px; border:0; cursor:pointer;
    background:var(--turq); color:var(--turq-ink); display:flex; align-items:center; justify-content:center;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1); }
  .play:active{ transform:scale(.93); }
  .p-txt{ min-width:0; flex:1; }
  .p-label{ font-family:var(--display); font-size:.68rem; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:var(--turq); }
  .p-time{ font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:.9rem; margin-top:3px; }
  .bar{ height:4px; border-radius:99px; background:rgba(255,255,255,.16); margin-top:9px; overflow:hidden; }
  .bar i{ display:block; height:100%; width:0; background:var(--turq); border-radius:99px; }

  .photo{ width:100%; border-radius:14px; display:block; margin:22px 0 0; border:1px solid var(--line); }
  .onward{ margin:34px 0 0; text-align:center; }
  .onward a{ display:inline-block; border:1px solid var(--line-strong); border-radius:12px;
    padding:13px 22px; color:var(--ink); text-decoration:none; font-weight:700; font-size:.95rem; }
  .onward a:hover{ border-color:var(--turq); color:var(--turq); }
  .state{ text-align:center; color:var(--ink-soft); padding:50px 10px; }
  .state b{ color:var(--ink); }
  .state a{ color:var(--turq); font-weight:700; text-decoration:none; }
  .foot{ margin-top:40px; text-align:center; font-size:12.5px; color:var(--ink-faint); }

  @keyframes skShimmer{ 100%{ transform:translateX(100%); } }
  .sk{ position:relative; overflow:hidden; border-radius:10px; background:rgba(255,255,255,.07); }
  .sk::after{ content:""; position:absolute; inset:0; transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
    animation:skShimmer 1.6s ease-in-out infinite; }
  .sk-line{ height:15px; margin:0 auto 12px; }
  @media (prefers-reduced-motion:reduce){ .sk::after{ animation:none; } .play:active{ transform:none; } }
  @view-transition { navigation: auto; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="mark"><b>Nana</b>fy</span></div>
  <main id="app">
    <div role="status" aria-label="Opening the memory">
      <div class="sk sk-line" style="width:45%"></div>
      <div class="sk sk-line" style="width:80%"></div>
      <div class="sk sk-line" style="width:30%;margin-bottom:26px"></div>
      <div class="sk" style="height:98px;border-radius:16px"></div>
    </div>
  </main>
  <p class="foot">Gathered with Nanafy — stories worth keeping, from the people who were there.</p>
</div>

            '<div class="p-txt"><div class="p-label">In their own voice</div>' +
            '<div class="p-time" id="time">' + (m.audio_seconds ? mmss(m.audio_seconds) : '\u2014') + '</div>' +
            '<div class="bar"><i id="bar"></i></div></div>' +
          '</div>'
        : '') +
      (m.photo_url ? '<img class="photo" src="' + esc(m.photo_url) + '" alt="">' : '') +
      '<div class="onward"><a href="/keepsake/view/' + q + '">See the whole keepsake \u2192</a></div>';

    var btn = document.getElementById('play');
    if (!btn) return;
    var audio = new Audio(m.audio_url);
    var bar = document.getElementById('bar'), time = document.getElementById('time');
    audio.addEventListener('timeupdate', function () {
      if (audio.duration) bar.style.width = (audio.currentTime / audio.duration * 100) + '%';
      time.textContent = mmss(audio.currentTime) + (audio.duration ? ' / ' + mmss(audio.duration) : '');
    });
    audio.addEventListener('ended', function () {
      btn.innerHTML = PLAY; btn.setAttribute('aria-label', 'Play'); bar.style.width = '0';
    });
    btn.addEventListener('click', function () {
      if (audio.paused) { audio.play().catch(function () {}); btn.innerHTML = PAUSE; btn.setAttribute('aria-label', 'Pause'); }
      else { audio.pause(); btn.innerHTML = PLAY; btn.setAttribute('aria-label', 'Play'); }
    });
  }

  (async function init() {
    if (!code || !id) { state('That link is missing something.<br><br><a href="/">Start here \u2192</a>'); return; }
    var ev;
    try {
      // The share code grants access, exactly as everywhere else; the id only
      // picks which memory to show.
      ev = await Nanafy.join(code,
        'id,title,honoree,event_type,share_code,memories(id,status,contributor_name,prompt_text,body,photo_url,audio_url,audio_seconds)');
    } catch (e) {
      state('Couldn\u2019t open this keepsake.<br>Check the link and try again.'); return;
    }
    var m = ((ev && ev.memories) || []).filter(function (x) { return x.id === id; })[0];
    if (!m || m.status !== 'approved') {
      state('<b>That memory isn\u2019t here.</b><br><br>It may have been taken down since the book was printed.' +
            '<br><br><a href="/keepsake/view/?c=' + encodeURIComponent(code) + '">See the whole keepsake \u2192</a>');
      return;
    }
    document.title = (m.contributor_name || 'A memory') + ' \u00b7 ' + (ev.honoree || ev.title || 'Nanafy');
    render(ev, m);
  })();
})();
</script>
</body>
</html>
